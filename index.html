<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Quản lý bán hàng">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Kiếm được 10 tỷ sẽ nghỉ làm 😎 – Quản lý bán hàng</title>
<style>
:root{
  --bg:#f3f6fc;--card:#fff;--ink:#17243a;--muted:#7c899d;--line:#e8edf5;
  --green:#18a875;--green2:#e8f8f1;--red:#d94d5c;--amber:#b97819;--blue:#3478ee;
  --shadow:0 5px 22px rgba(34,67,115,.055)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;touch-action:manipulation}
input,select,textarea{font-size:16px}
button{cursor:pointer;border:0;border-radius:10px;padding:9px 14px;min-height:40px;background:var(--blue);color:#fff;font-size:14px;font-weight:650;transition:transform .1s,opacity .12s}
button:active{transform:scale(.98);opacity:.9}
button:disabled{opacity:.55;pointer-events:none}
button.secondary{background:#eef3fa;color:#475569}
button.danger{background:#fff0f0;color:var(--red)}
button.small{padding:6px 10px;min-height:34px;font-size:12.5px;border-radius:8px}
.link-btn{background:transparent;color:var(--blue);padding:6px 4px;min-height:34px;font-size:13px}
.full-btn{width:100%;margin-top:12px}
.hidden{display:none!important}
.muted{color:var(--muted)}
.positive{color:var(--green);font-weight:750}
.negative{color:var(--red);font-weight:700}

/* Khung ứng dụng & Menu ngăn kéo */
.app{display:block;width:100%;min-height:100dvh}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:8px 14px;padding-top:max(8px,env(safe-area-inset-top));background:#fff;border-bottom:1px solid #e9eef6}
.menu-btn{width:40px;height:40px;min-height:40px;padding:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;background:#edf4ff;border-radius:10px}
.menu-btn span{display:block;width:20px;height:2.5px;border-radius:2px;background:var(--blue)}
.tb-brand{font-weight:800;font-size:15px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.syncstat{margin-left:auto;background:transparent;font-size:12px;font-weight:700;min-height:32px;padding:4px 8px;border-radius:8px;white-space:nowrap}
.syncstat.ok{color:var(--green)}.syncstat.busy{color:var(--blue)}.syncstat.err{color:#d64545}.syncstat.out{color:#8b98aa}.syncstat.warn{color:#e08a00}
.drawer-bg{position:fixed;inset:0;background:#172b4880;z-index:40}
.drawer{position:fixed;top:0;left:0;bottom:0;width:min(280px,82vw);background:#fff;z-index:50;transform:translateX(-104%);transition:transform .22s cubic-bezier(.2,.8,.2,1);padding:max(18px,env(safe-area-inset-top)) 12px max(18px,env(safe-area-inset-bottom));overflow:auto;box-shadow:6px 0 24px #0002}
.drawer.open{transform:none}
.drawer-head{font-weight:800;font-size:16px;padding:4px 8px 14px;color:var(--ink)}
.drawer-head small{display:block;font-weight:600;font-size:11px;color:#8b98aa;margin-top:3px}
.menu{display:grid;gap:4px}
.menu button{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:transparent;color:#27324d;font-size:15px;font-weight:600;padding:8px 10px;border-radius:10px;min-height:48px}
.menu button.active,.menu button:hover{background:#edf4ff;color:#2563eb}
.mi{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1;flex:none}
.drawer-note{font-size:12px;color:#8b98aa;padding:18px 10px}

/* Nội dung chính & Tổng quan */
.main{max-width:1360px;width:100%;margin:0 auto;padding:14px 16px calc(32px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.top>div{min-width:0;flex:1}
#today{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1{font-size:20px;margin:2px 0 0;letter-spacing:-.4px}
.top>button{box-shadow:0 5px 12px #3478ee25;white-space:nowrap}
.dash{display:block}
.fold{background:#fff;border:1px solid #e9eef6;border-radius:14px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:13px 14px;font-weight:700;font-size:14px;color:var(--ink)}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary:after{content:'▾';color:#8b98aa;transition:transform .2s}
.fold:not([open])>summary:after{transform:rotate(90deg)}
.fold-body{padding:0 14px 14px}
.fin-grid{display:grid;grid-template-columns:1fr 1fr;text-align:center;padding:2px 0 10px}
.fin-grid>div+div{border-left:1px solid var(--line)}
.fin-grid small{display:block;font-size:12px;color:var(--muted)}
.fin-grid strong{display:block;font-size:clamp(16px,5vw,22px);margin-top:3px;white-space:nowrap}
.fin-grid .rev{color:var(--blue)}
.summary-stat{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;color:#64748b}
.summary-stat strong{color:var(--ink);font-size:13.5px}

/* Thẻ chỉ số, Báo cáo & Biểu đồ */
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.card,.panel{background:var(--card);border:1px solid #e9eef6;border-radius:14px;padding:15px;box-shadow:var(--shadow)}
.panel h2{font-size:15px;font-weight:750;margin:0 0 12px}
.metric-card{min-width:0;overflow:hidden}
.metric-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.metric-label{font-size:12.5px;font-weight:600;color:#64748b}
.metric-icon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:16px;font-weight:800;flex:none}
.metric-icon.blue{background:#eaf1ff;color:var(--blue)}.metric-icon.green{background:#e7f8ef;color:#1ba878}.metric-icon.orange{background:#fff2e3;color:#ee982e}.metric-icon.purple{background:#f2eaff;color:#9360db}
.metric{font-size:clamp(16px,4.6vw,23px);font-weight:800;margin:8px 0 2px;letter-spacing:-.6px;white-space:nowrap}
.metric-note{font-size:11px;color:var(--muted)}
.report-profit-strip{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;margin:-4px 0 16px;background:#fff;border:1px solid #e9eef6;border-radius:14px;box-shadow:var(--shadow)}
.report-profit-strip span,.report-profit-strip small{display:block}
.report-profit-strip small{font-size:12px;color:var(--muted);margin-top:2px}
.report-profit-strip>strong{font-size:clamp(17px,4.8vw,22px);white-space:nowrap}
.rp-nav{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.rp-nav>button{width:44px;padding:0;font-size:22px}
.rp-mid{flex:1;min-width:0;display:grid;gap:4px;justify-items:center;text-align:center}
.rp-mid input{width:100%;max-width:240px;text-align:center;min-height:40px;padding:8px 10px;border:1px solid #dce2ea;border-radius:10px;background:#fff;color:var(--ink)}
.analytics-chart{width:100%;overflow-x:auto;margin-top:10px}
.compact-chart svg{max-height:190px}
.analytics-chart svg{display:block;width:100%;min-width:520px;height:auto}.compact-chart svg{min-width:0}
.analytics-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:#64748b;margin-top:8px}
.analytics-legend span{display:inline-flex;align-items:center;gap:6px}
.legend-dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.chart-gridline{stroke:#e9eef6;stroke-width:1}
.chart-value-label{font-size:10px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.chart-axis{fill:#8b98aa;font-size:10px}
.chart-line{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.chart-point{stroke:#fff;stroke-width:2}

/* Thanh công cụ, Biểu mẫu, Bảng & Danh sách thẻ */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.field{display:grid;gap:4px;margin-bottom:10px}
.field label{font-size:12.5px;font-weight:650;color:#526071}
.field input,.field select,.field textarea,.toolbar input,.toolbar select{width:100%;min-height:42px;padding:9px 11px;border:1px solid #dce2ea;border-radius:10px;background:#fff;color:var(--ink);outline:none;font-size:16px}
.toolbar input,.toolbar select{max-width:240px}
.toolbar input:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:#78a8f7;box-shadow:0 0 0 3px #3478ee18}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;white-space:nowrap}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);font-size:12.5px}
th{color:var(--muted);font-weight:650;background:#f8faff}
td strong{font-size:13px}
.stat-table th,.stat-table td{text-align:center}
.stat-table th:first-child,.stat-table td:first-child{text-align:left}
.tag{display:inline-block;border-radius:30px;padding:4px 9px;background:var(--green2);color:#159b6b;font-size:12px;font-weight:600}
.tag.warn{background:#fff5df;color:var(--amber)}
.tag.bad{background:#fdecec;color:#d93636}
.notice{background:#eef5ff;border:1px solid #dce9ff;border-radius:10px;padding:10px 12px;color:#4a6793;font-size:12.5px;margin-bottom:12px;line-height:1.45}
.empty{text-align:center;color:var(--muted);padding:28px 14px;font-size:13px}
.olist{background:#fff;border:1px solid #e9eef6;border-radius:14px;box-shadow:var(--shadow);padding:0 12px;overflow:hidden}
.orow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #eef2f7;cursor:pointer;transition:background .12s}
.orow:last-child{border-bottom:0}
.orow:hover,.orow:active{background:#f5f8ff}
.oic{width:44px;height:44px;flex:none;border:1px solid #dce2ea;border-radius:11px;background:#f8faff;display:grid;place-items:center;font-size:20px;overflow:hidden}
.oic img{width:100%;height:100%;object-fit:cover}
.oic.big{width:56px;height:56px;font-size:24px}
.omid{flex:1;min-width:0}
.ocus,.lname{font-weight:700;font-size:15px;overflow-wrap:anywhere}
.ocus{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ocode,.odate,.lmeta{font-size:12px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.lline{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.lline strong{color:var(--ink)}
#cycleRows .lline,#bonusRows .lline,#busRows .lline{white-space:normal}
#cycleRows a.tag{text-decoration:none;margin-left:4px}
.oright{text-align:right;flex:none}
.oamt{font-weight:800;font-size:15px;margin-top:2px;white-space:nowrap}
.oprofit{font-size:12px;margin-top:1px;white-space:nowrap}
.ldel{background:transparent;color:#d64545;min-height:36px;padding:4px 8px;font-size:16px}
.customerbox{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.customerbox:last-of-type{border-bottom:0}
.product-thumb{width:52px;height:52px;object-fit:cover;border-radius:10px;border:1px solid #e8edf5;background:#f3f6fc}

/* Hộp thoại Modal & Chi tiết đơn */
.modal{position:fixed;inset:0;background:#172b4888;display:grid;place-items:center;padding:14px;z-index:60}
.dialog{background:#fff;border-radius:16px;padding:18px;width:min(680px,100%);max-height:90dvh;overflow:auto;box-shadow:0 20px 70px #0003}
.dialoghead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.dialoghead h2{margin:0;font-size:17px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.span2{grid-column:1/-1}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.summaryline{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.order-detail-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:2px 0 14px;border-bottom:1px solid var(--line)}
.order-code{font-size:19px;display:block;margin-top:2px}
.detail-section{padding:14px 0;border-bottom:1px solid var(--line)}
.detail-section:last-of-type{border-bottom:0}
.detail-section h3{font-size:14.5px;margin:0 0 9px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.detail-grid small{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.detail-grid strong{display:block;font-size:13.5px;overflow-wrap:anywhere}
.detail-lines{min-width:520px}
.detail-profit{padding-top:10px;margin-top:4px}

/* Trang toàn màn hình: Tạo đơn, Chọn hàng & Chọn khách */
.fp{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column}
.fp-head{display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));background:var(--blue);color:#fff}
.fp-head h2{flex:1;margin:0;font-size:17px}
.fp-head button{background:transparent;color:#fff;font-size:15px;min-height:38px}
.fp-head button:first-child{font-size:30px;line-height:1;padding:0 12px}
.fp-head .fp-save{background:#fff;color:var(--blue);font-weight:700;padding:6px 13px}
.fp-body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding-bottom:20px}
.fp-search{padding:8px 12px;background:#fff;border-bottom:1px solid #e9eef6}
.fp-search input{width:100%;min-height:42px;padding:9px 12px;border:1px solid #dce2ea;border-radius:10px;font-size:16px;outline:none;background:#fff;color:var(--ink)}
.fp-search input:focus{border-color:#78a8f7;box-shadow:0 0 0 3px #3478ee18}
.fp-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:#fff;border-top:1px solid #e9eef6}
.fp-foot strong{font-size:20px;color:var(--blue)}
.fp-foot button{flex:1}
.sec{background:#fff;margin:8px auto 0;padding:12px 14px;max-width:760px}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.cust-pick-row{display:flex;gap:6px;align-items:center;margin-top:4px}
.cust-pick-btn{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:8px;background:#f4f8ff;border:1px solid #d5e3fc;color:var(--ink);padding:9px 12px;border-radius:10px;text-align:left;font-weight:700;font-size:15px}
.cust-pick-btn .cp-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cust-pick-btn .cp-caret{color:var(--blue);font-size:12.5px;font-weight:700;flex:none}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #eef2f7;font-size:14px}
.kv:first-of-type{margin-top:8px}
.kv input{width:60%;text-align:right;min-height:38px;padding:6px 10px;border:1px solid #dce2ea;border-radius:8px;font-size:16px;color:var(--ink)}
.ol{display:grid;grid-template-columns:56px 1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid #eef2f7;align-items:start}
.ol img,.ol .ph{width:56px;height:56px;border-radius:10px;object-fit:cover;background:#edf4ff;display:grid;place-items:center;font-size:22px}
.ol-name{font-weight:700;font-size:14px;overflow-wrap:anywhere}
.stepper{display:inline-flex;border:1px solid #dce2ea;border-radius:9px;overflow:hidden;margin-top:6px;vertical-align:middle}
.stepper button{background:#fff;color:var(--blue);width:40px;min-height:36px;padding:0;border-radius:0;font-size:22px}
.stepper input{width:58px;text-align:center;border:0;border-left:1px solid #dce2ea;border-right:1px solid #dce2ea;border-radius:0;min-height:36px;padding:0;font-size:16px;color:var(--ink)}
.ol-price{text-align:right;display:grid;gap:6px;justify-items:end}
.ol-total{font-weight:800;font-size:14px}
.ol-unit{width:108px;text-align:right;min-height:36px;padding:4px 8px;font-size:16px;border:1px solid #dce2ea;border-radius:8px;color:var(--ink)}
.ol-nm,.ol-cost{width:100%;min-height:36px;padding:4px 8px;font-size:16px;margin-top:4px;border:1px solid #dce2ea;border-radius:8px;color:var(--ink)}
.pk{display:flex;gap:12px;padding:11px 14px;background:#fff;border-bottom:1px solid #eef2f7;align-items:center;cursor:pointer;max-width:760px;margin:0 auto}
.pk .th{width:52px;height:52px;border-radius:10px;overflow:hidden;position:relative;flex:none;background:#edf4ff;display:grid;place-items:center;font-size:21px}
.pk .th img{width:100%;height:100%;object-fit:cover}
.pk .tick{position:absolute;inset:0;background:#3478eecc;color:#fff;display:none;place-items:center;font-size:26px}
.pk.on{background:#f0f6ff}
.pk.on .tick{display:grid}
.pk .nm{flex:1;min-width:0;font-weight:700;font-size:14.5px}
.pk .nm small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk .pr{color:var(--blue);font-weight:800;font-size:14px;white-space:nowrap}

/* Toast & Lớp phủ đồng bộ */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom));width:max-content;max-width:88vw;background:var(--ink);color:#fff;padding:10px 15px;border-radius:12px;font-size:13.5px;z-index:95;box-shadow:0 6px 20px #0004;text-align:center;line-height:1.4}
.loading-overlay{position:fixed;inset:0;background:rgba(23,36,58,.55);backdrop-filter:blur(2px);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:14px}
.loading-spinner{width:44px;height:44px;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
.loading-text{font-size:15px;font-weight:700;text-shadow:0 2px 6px rgba(0,0,0,.3)}
@keyframes spin{to{transform:rotate(360deg)}}

@media(min-width:1000px){
  .main{padding:22px 28px 40px}
  .top h1{font-size:24px}
  .dash{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;align-items:start}
  .dash .d-chart{grid-column:1/-1;order:3}
  .dash .d-fin{order:1}.dash .d-stat{order:2}.dash .d-recent{order:4}.dash .d-care{order:5}
}
@media(max-width:850px){
  .cards,.report-metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .card{padding:12px}
}
@media(max-width:640px){
  .formgrid{grid-template-columns:1fr}
  .span2{grid-column:auto}
}
@media(max-width:420px){
  .chart-value-label{font-size:8.5px;stroke-width:2.5px}
  .metric-icon{width:30px;height:30px;font-size:14px}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar"><button id="menuBtn" class="menu-btn" aria-label="Mở menu" aria-expanded="false"><span></span><span></span><span></span></button><span class="tb-brand">🤑 Kiếm được 10 tỷ sẽ nghỉ làm</span><button id="syncStat" type="button" class="syncstat out">☁</button></div>
  <div id="drawerBg" class="drawer-bg hidden"></div>

<script>
const KEY='mysales_v1';
const G=id=>document.getElementById(id);
let db=load();
let page='dashboard';
let orderLines=[];
let cloud=null,cloudUser=null,cloudBusy=false;

function unpackProd(p){
  if(!p)return p;
  let note=String(p.note??''),unit=String(p.unit??'').trim();
  const m=note.match(/^\[ĐVT:([^\]]+)\]\s*/);
  if(m){if(!unit)unit=m[1].trim();note=note.slice(m[0].length)}
  return {...p,unit:unit||'kg',note};
}
function packProdNote(unit,note){
  const u=String(unit??'').trim()||'kg',n=String(note??'').trim();
  return u!=='kg'?`[ĐVT:${u}]${n?' '+n:''}`:n;
}

function load(){
  let raw=null;
  try{
    raw=localStorage.getItem(KEY);
    let d=JSON.parse(raw)||{};
    for(const k of ['orders','customers','products','expenses','buses'])if(!Array.isArray(d[k]))d[k]=[];
    d.products=d.products.map(unpackProd);
    return d;
  }catch{
    return{orders:[],customers:[],products:[],expenses:[],buses:[]};
  }
}

const money=n=>(Number(n)||0).toLocaleString('vi-VN')+'\u00a0₫';
const num=v=>Number(String(v??'').replace(/[^0-9-]/g,''))||0;
const qtyVal=v=>{let n=parseFloat(String(v??'').replace(',','.'));return Number.isFinite(n)?n:0};
const fmtMoneyInput=v=>{let d=String(v??'').replace(/[^0-9]/g,'').replace(/^0+(?=\d)/,'');return d?d.replace(/\B(?=(\d{3})+(?!\d))/g,'.'):''};
const normText=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/gi,'d').toLowerCase().replace(/\s+/g,' ').trim();
const searchKey=(...parts)=>{const raw=parts.join(' '),dg=raw.replace(/\D/g,'');return normText(raw)+(dg?' '+dg:'')};
const COMMON_UNITS=['kg','thùng','túi','gói','hộp','chai','can','cái'];
const prodUnit=p=>String(p?.unit||'kg').trim()||'kg';
const unitOf=l=>String(l?.unit||product(l?.productId)?.unit||'kg').trim()||'kg';

document.addEventListener('input',e=>{
  if(e.target.matches('[data-money],#pCost,#pPrice,#eAmount,#oExtra')||((e.target.tagName==='INPUT')&&e.target.inputMode==='numeric'&&!e.target.dataset.rawNum&&e.target.title!=='Số lượng'&&!e.target.title?.includes('Số lượng'))){
    let el=e.target,old=el.value,next=fmtMoneyInput(old);
    if(next!==old){el.value=next;try{el.setSelectionRange(next.length,next.length)}catch(_){}}
  }
});

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'\x26amp;','<':'\x26lt;','>':'\x26gt;','"':'\x26quot;',"'":'\x26#39;'}[c]));
const today=()=>new Date().toLocaleDateString('sv-SE');
const dateFmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString('vi-VN'):'—';

function customer(id){return db.customers.find(x=>x.id===id)}
function product(id){return db.products.find(x=>x.id===id)}
function orderProfit(o){return o.lines.reduce((s,l)=>s+(num(l.price)-num(l.cost))*qtyVal(l.qty),0)+num(o.surcharge)-num(o.extraCost)-expensesTotal(db.expenses.filter(e=>e.orderId===o.id))}
function revenue(o){return o.lines.reduce((s,l)=>s+num(l.price)*qtyVal(l.qty),0)+num(o.surcharge)}
function cost(o){return o.lines.reduce((s,l)=>s+num(l.cost)*qtyVal(l.qty),0)}
function expensesTotal(list){return list.reduce((s,x)=>s+num(x.amount),0)}
function inRange(d,from,to){return d>=from&&d<=to}
function weekStart(d){let x=new Date(d+'T00:00:00');let day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return x.toLocaleDateString('sv-SE')}
function totals(orders,expenses){let r=orders.reduce((s,o)=>s+revenue(o),0),c=orders.reduce((s,o)=>s+cost(o),0),e=expensesTotal(expenses)+orders.reduce((s,o)=>s+num(o.extraCost),0);return{r,c,e,p:r-c-e,n:orders.length}}

function render(){
  document.getElementById('quickAdd').classList.toggle('hidden',!['dashboard','orders'].includes(page));
  document.getElementById('today').textContent=new Date().toLocaleDateString('vi-VN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  document.getElementById('pageTitle').textContent=({dashboard:'Tổng quan',orders:'Đơn hàng',customers:'Khách hàng',cycle:'Chu kỳ nhập hàng',bonus:'Các khách YÊU bonus',buses:'Xe gửi tỉnh',products:'Sản phẩm',expenses:'Chi phí',reports:'Báo cáo',settings:'Dữ liệu'})[page];
  document.querySelectorAll('.menu button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
  let el=document.getElementById('page');
  el.innerHTML=({dashboard:dashboardPage,orders:ordersPage,customers:customersPage,cycle:cyclePage,bonus:bonusPage,buses:busesPage,products:productsPage,expenses:expensesPage,reports:reportsPage,settings:settingsPage})[page]();
}

function metric(label,value,note='',ico='•',tone='blue'){
  return `<div class="card metric-card"><div class="metric-top"><div class="metric-label">${label}</div><span class="metric-icon ${tone}">${ico}</span></div><div class="metric">${value}</div><div class="metric-note">${note}</div></div>`;
}

function analyticsChart(data,series,compact=false){
  if(!data.length)return '<div class="empty">Chưa có dữ liệu để vẽ biểu đồ.</div>';
  const W=820,H=compact?190:250,L=58,R=18,T=18,B=38,innerW=W-L-R,innerH=H-T-B;
  const vals=data.flatMap(d=>series.map(z=>num(d[z.key]))),lo=Math.min(0,...vals),hi=Math.max(1,...vals),pad=(hi-lo)*.12||1,min=lo-pad,max=hi+pad;
  const x=i=>L+(data.length===1?innerW/2:i*innerW/(data.length-1)),y=v=>T+(max-v)/(max-min)*innerH;
  let grid='';for(let i=0;i<5;i++){let v=max-(max-min)*i/4,yy=y(v);grid+=`<line class="chart-gridline" x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}"/><text class="chart-axis" x="${L-8}" y="${yy+3}" text-anchor="end">${Math.abs(v)>=1000000?(v/1000000).toFixed(1)+'tr':Math.abs(v)>=1000?Math.round(v/1000)+'k':Math.round(v)}</text>`}
  const bars=series.filter(z=>z.type==='bar'),barW=Math.min(compact?25:34,innerW/Math.max(data.length,1)*.42);
  const chartAmount=v=>{let n=Math.round(num(v)),a=Math.abs(n);if(a>=1000000)return (n/1000000).toLocaleString('vi-VN',{maximumFractionDigits:1})+'tr';if(a>=1000)return (n/1000).toLocaleString('vi-VN',{maximumFractionDigits:1})+'k';return String(n)};
  let shapes=data.map((d,i)=>{let group=bars.length,each=barW/Math.max(group,1);return bars.map((z,j)=>{let xx=x(i)+(j-(group-1)/2)*each-each/2,yy=y(num(d[z.key])),base=y(0),top=Math.min(yy,base);return `<rect x="${xx}" y="${top}" width="${each*.82}" height="${Math.max(1,Math.abs(base-yy))}" rx="3" fill="${z.color}"><title>${z.label}: ${money(d[z.key])}</title></rect>`}).join('')}).join('');
  let lines=series.filter(z=>z.type!=='bar').map((z,zi)=>{let pts=data.map((d,i)=>`${x(i)},${y(num(d[z.key]))}`).join(' ');let dots=data.map((d,i)=>{let cy=y(num(d[z.key])),labelY=Math.min(H-B-16,cy+18+(zi*10));return `<circle class="chart-point" cx="${x(i)}" cy="${cy}" r="3.5" fill="${z.color}"><title>${z.label}: ${money(d[z.key])}</title></circle><text x="${x(i)}" y="${labelY}" text-anchor="middle" class="chart-value-label" fill="${z.color}">${chartAmount(d[z.key])}</text>`}).join('');return `<polyline class="chart-line" stroke="${z.color}" points="${pts}"/>${dots}`}).join('');
  let labels=data.map((d,i)=>`<text class="chart-axis" x="${x(i)}" y="${H-10}" text-anchor="middle">${esc(d.label)}</text>`).join('');
  return `<div class="analytics-chart ${compact?'compact-chart':''}"><svg viewBox="0 0 ${W} ${H}" role="img">${grid}${shapes}${lines}${labels}</svg></div><div class="analytics-legend">${series.map(z=>`<span><i class="legend-dot" style="background:${z.color}"></i>${z.label}</span>`).join('')}</div>`;
}

function expenseBreakdown(orders,expenses){
  let ads=expensesTotal(expenses.filter(e=>(e.type||(e.category==='Quảng cáo'?'ads':'other'))==='ads'));
  let other=expensesTotal(expenses.filter(e=>(e.type||(e.category==='Quảng cáo'?'ads':'other'))!=='ads'))+orders.reduce((a,o)=>a+num(o.extraCost),0);
  return{ads,other};
}

function dashboardPage(){
  let now=today(),month=now.slice(0,7);
  let mo=db.orders.filter(o=>o.date.startsWith(month));
  let me=db.expenses.filter(e=>e.date.startsWith(month)),mt=totals(mo,me),mb=expenseBreakdown(mo,me);
  let recent=[...db.orders].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
  let overdue=db.customers.map(cycleInfo).filter(Boolean).filter(x=>!cycIsHidden(x)).map(x=>{x.st=cycleStatus(x);return x}).filter(x=>x.st==='late'||x.st==='soon'||(x.st==='new'&&x.since>=30)).sort((a,b)=>(a.left??9999)-(b.left??9999));
  let days=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);let k=d.toLocaleDateString('sv-SE'),os=db.orders.filter(o=>o.date===k),es=db.expenses.filter(e=>e.date===k);let t=totals(os,es);return{key:k,label:k.slice(8)+'/'+k.slice(5,7),...t,totalCost:t.c+t.e}});
  const rp=[{key:'r',label:'Doanh số',color:'#3478ee',type:'bar'},{key:'totalCost',label:'Chi phí',color:'#f29b38',type:'bar'},{key:'p',label:'Lợi nhuận',color:'#18a875',type:'line'}];
  const srow=(lab,n)=>{let d=new Date();d.setDate(d.getDate()-n);let f=d.toLocaleDateString('sv-SE'),t=totals(db.orders.filter(o=>inRange(o.date,f,now)),db.expenses.filter(e=>inRange(e.date,f,now)));return `<tr><td>${lab}</td><td>${money(t.r)}</td><td class="${t.p<0?'negative':'positive'}">${money(t.p)}</td></tr>`};
  return `<div class="dash">
  <details class="fold d-fin" open><summary>📅 Tài chính tháng này</summary><div class="fold-body"><div class="fin-grid"><div><small>Doanh thu</small><strong class="rev">${money(mt.r)}</strong></div><div><small>Lợi nhuận</small><strong class="${mt.p<0?'negative':'positive'}">${money(mt.p)}</strong></div></div>
  <div class="summary-stat"><span>Số đơn hàng</span><strong>${mo.length}</strong></div><div class="summary-stat"><span>Giá vốn hàng bán</span><strong>${money(mt.c)}</strong></div><div class="summary-stat"><span>Chi phí quảng cáo</span><strong>${money(mb.ads)}</strong></div><div class="summary-stat"><span>Chi phí khác</span><strong>${money(mb.other)}</strong></div>
  <button class="secondary full-btn" onclick="page='reports';render()">Xem báo cáo chi tiết →</button></div></details>
  <details class="fold d-chart" open><summary>📊 Biểu đồ 7 ngày gần đây</summary><div class="fold-body">${analyticsChart(days,rp,true)}</div></details>
  <details class="fold d-stat" open><summary>📋 Thống kê</summary><div class="fold-body"><div class="tablewrap"><table class="stat-table"><thead><tr><th>--</th><th>Doanh thu</th><th>Lợi nhuận</th></tr></thead><tbody>${srow('Hôm nay',0)}${srow('7 ngày',6)}${srow('30 ngày',29)}</tbody></table></div></div></details>
  <details class="fold d-recent" open><summary>🧾 Đơn hàng gần đây</summary><div class="fold-body">${recent.length?`<div class="tablewrap"><table><thead><tr><th>Ngày</th><th>Khách hàng</th><th>Doanh thu</th><th>Lợi nhuận</th></tr></thead><tbody>${recent.map(o=>`<tr onclick="showOrderDetail('${esc(o.id)}')" style="cursor:pointer"><td>${dateFmt(o.date)}</td><td><strong>${esc(customer(o.customerId)?.name||'Khách lẻ')}</strong></td><td>${money(revenue(o))}</td><td class="${orderProfit(o)<0?'negative':'positive'}">${money(orderProfit(o))}</td></tr>`).join('')}</tbody></table></div><button class="link-btn" onclick="page='orders';render()">Xem tất cả →</button>`:'<div class="empty">Chưa có đơn hàng. Hãy tạo đơn đầu tiên.</div>'}</div></details>
  <details class="fold d-care" open><summary>📞 Khách chuẩn bị & đã trễ${overdue.length?` (${overdue.length})`:''}</summary><div class="fold-body">${overdue.length?overdue.slice(0,8).map(x=>{const tel=String(x.c.phone||'').replace(/[^0-9+]/g,'');const tg=x.st==='late'?`<span class="tag bad">Trễ ${-x.left} ngày</span>`:x.st==='soon'?`<span class="tag warn">${x.left===0?'Hôm nay':'Còn '+x.left+' ngày'}</span>`:`<span class="tag warn">${x.since} ngày chưa mua</span>`;return `<div class="customerbox"><div><strong>${esc(x.c.name)}</strong><div class="muted">${esc(x.c.area||x.c.address||'Chưa có địa chỉ')}</div></div><div style="display:flex;gap:6px;align-items:center">${tg}${tel?`<a class="tag" href="tel:${tel}" style="text-decoration:none">📞</a>`:''}</div></div>`}).join('')+(overdue.length>8?`<button class="secondary small" style="margin-top:8px;width:100%" onclick="goCycle()">Xem tất cả ${overdue.length} khách</button>`:`<button class="secondary small" style="margin-top:8px;width:100%" onclick="goCycle()">Xem chu kỳ nhập hàng</button>`):'<div class="empty">Chưa có khách nào sắp hết hàng hoặc trễ hạn.</div>'}</div></details>
  </div>`;
}

const ORDER_PAGE_SIZE=40;
let orderLimit=ORDER_PAGE_SIZE,orderQuery='';

function orderMatch(o,q){
  const c=customer(o.customerId);
  return searchKey(c?.name||'Khách lẻ',c?.phone,c?.area,o.id,o.date,dateFmt(o.date),o.note,o.lines.map(l=>l.name).join(' ')).includes(q);
}
function buildOrderListParts(){
  const sorted=db.orders.map((o,i)=>({o,i})).sort((a,b)=>b.o.date.localeCompare(a.o.date)||b.i-a.i).map(x=>x.o);
  const q=normText(orderQuery);
  const matched=q?sorted.filter(o=>orderMatch(o,q)):sorted;
  const lim=q?Math.max(orderLimit,100):orderLimit;
  const shown=matched.slice(0,lim),rem=matched.length-shown.length;
  const meta=q?`Tìm thấy ${matched.length} đơn phù hợp`:(matched.length?`Hiển thị ${shown.length} / ${matched.length} đơn gần nhất`:'');
  const rowsHtml=shown.map(orderRow).join('')||`<div class="empty">${q?'Không tìm thấy đơn hàng phù hợp':'Chưa có đơn hàng'}</div>`;
  const moreHtml=rem>0?`<button type="button" class="secondary full-btn" onclick="loadMoreOrders()">⬇ Xem thêm ${Math.min(ORDER_PAGE_SIZE,rem)} đơn cũ hơn (còn ${rem} đơn)</button>`:'';
  return {meta,rowsHtml,moreHtml};
}
function renderOrderRows(){
  const {meta,rowsHtml,moreHtml}=buildOrderListParts();
  if(G('orderMeta'))G('orderMeta').textContent=meta;
  if(G('orderRows'))G('orderRows').innerHTML=rowsHtml;
  if(G('orderMore'))G('orderMore').innerHTML=moreHtml;
}
function loadMoreOrders(){orderLimit+=ORDER_PAGE_SIZE;renderOrderRows()}

function ordersPage(){
  const {meta,rowsHtml,moreHtml}=buildOrderListParts();
  return `<div class="toolbar" style="margin-bottom:6px"><input id="orderSearch" style="max-width:none;flex:1" value="${esc(orderQuery)}" placeholder="🔍 Tìm mã đơn, tên khách không dấu, SĐT, sản phẩm..."></div><div id="orderMeta" class="muted" style="font-size:12px;margin:0 2px 8px">${esc(meta)}</div><div id="orderRows" class="olist">${rowsHtml}</div><div id="orderMore">${moreHtml}</div>`;
}

function orderRow(o){
  let cObj=customer(o.customerId),c=cObj?.name||'Khách lẻ';
  return `<div class="orow order-row" tabindex="0" role="button" onclick="showOrderDetail('${esc(o.id)}')" data-search="${esc(searchKey(c,cObj?.phone,o.id,o.note,o.lines.map(l=>l.name).join(' ')))}"><div class="oic">🧾</div><div class="omid"><div class="ocus">${esc(c)}</div><div class="ocode">${esc(o.id)}</div></div><div class="oright"><div class="odate">${dateFmt(o.date)}</div><div class="oamt">${money(revenue(o))}</div><div class="oprofit ${orderProfit(o)<0?'negative':'positive'}">Lãi ${money(orderProfit(o))}</div></div></div>`;
}

function showOrderDetail(id){
  let o=db.orders.find(x=>x.id===id);if(!o)return;
  let c=customer(o.customerId),linked=db.expenses.filter(e=>e.orderId===o.id),extra=num(o.extraCost),rev=revenue(o),baseCost=cost(o),linkedCost=expensesTotal(linked),profit=orderProfit(o);

function cycleInfo(c){
  const os=db.orders.filter(o=>o.customerId===c.id&&o.date);
  const dates=[...new Set(os.map(o=>o.date))].sort();
  if(!dates.length)return null;
  const DAY=86400000,D=d=>new Date(d+'T00:00:00'),T0=D(today());
  const diff=(a,b)=>Math.round((D(a)-D(b))/DAY);
  const med=a=>{const r=[...a].sort((x,y)=>x-y),n=r.length;return n%2?r[(n-1)/2]:(r[n/2-1]+r[n/2])/2};
  const last=dates.at(-1),since=Math.round((T0-D(last))/DAY);
  // 1) Chu kỳ theo ngày (dự phòng khi chưa đủ dữ liệu theo sản phẩm)
  const gaps=[];for(let i=1;i<dates.length;i++){const g=diff(dates[i],dates[i-1]);if(g>0)gaps.push(g)}
  const cycle=gaps.length?Math.round(med(gaps.slice(-5))):null;
  const dateLeft=cycle===null?null:cycle-since;
  // 2) Dự báo theo từng sản phẩm: lượng dùng mỗi ngày = lượng đã lấy / số ngày đến lần lấy kế tiếp
  const byP={};
  os.forEach(o=>o.lines.forEach(l=>{const k=String(l.name||'').trim().toLowerCase(),q=qtyVal(l.qty);if(!k||!(q>0))return;const e=byP[k]||(byP[k]={name:l.name,days:{}});e.days[o.date]=(e.days[o.date]||0)+q}));
  const prods=Object.values(byP).map(e=>{
    const ds=Object.keys(e.days).sort(),qs=ds.map(d=>e.days[d]);
    const r={name:e.name,qty:med(qs.slice(-5)),left:null,last:ds.at(-1)};
    let sq=0,sd=0;
    for(let i=Math.max(0,ds.length-5);i<ds.length-1;i++){const g=diff(ds[i+1],ds[i]);if(g>0){sq+=qs[i];sd+=g}}
    if(sq>0&&sd>0){const sp=diff(today(),ds.at(-1));r.rate=sq/sd;r.cover=qs.at(-1)/r.rate;r.left=Math.round(r.cover-sp);r.stopped=sp>Math.max(2*r.cover,7)}
    return r;
  }).sort((a,b)=>(a.left??9999)-(b.left??9999));
  const known=prods.filter(p=>p.left!==null);
  const active=known.filter(p=>!p.stopped),shown=active.length?active:known; // bỏ qua món khách đã ngừng lấy (trễ quá gấp đôi chu kỳ dùng)
  const left=shown.length?shown[0].left:dateLeft;
  const items={};
  os.filter(o=>o.date===last).forEach(o=>o.lines.forEach(l=>{items[l.name]=(items[l.name]||0)+qtyVal(l.qty)}));
  const next=left===null?null:new Date(T0.getTime()+left*DAY);
  return{c,last,cycle,since,left,items:Object.entries(items),next,count:dates.length,prods,shown,byQty:known.length>0};
}
function cycleStatus(x){
  if(x.left===null)return'new';
  if(x.left<0)return'late';
  if(x.left<=3)return'soon';
  return'ok';
}

function getInvCfg(){
  try{
    const c=JSON.parse(localStorage.getItem(VQ_KEY)||'{}')||{};
    return {
      coName:c.coName||INV_CO.name, coAddr:c.coAddr||INV_CO.addr, coHot:c.coHot||INV_CO.hot,
      enabled:!!c.enabled, bank:c.bank||'MB', accNo:String(c.accNo||'').trim(),
      accName:String(c.accName||'').trim(), keepBanner:c.keepBanner!==false
    };
  }catch{
    return {coName:INV_CO.name,coAddr:INV_CO.addr,coHot:INV_CO.hot,enabled:false,bank:'MB',accNo:'',accName:'',keepBanner:true};
  }
}

function buildVietQrInfo(o,c){
  const nm=normText(c?.name||'Khach').replace(/[^a-z0-9 ]/g,' ').trim().toUpperCase().slice(0,22);
  const code=String(o.id||'').replace(/[^a-zA-Z0-9]/g,'').toUpperCase();
  return `${nm} TT ${code}`.replace(/\s+/g,' ').trim().slice(0,50);
}

let invState=null;
function invLoad(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
async function invLoadRemote(url,ms=3500){
  if(!navigator.onLine)return null;
  const ctrl=new AbortController(),tm=setTimeout(()=>ctrl.abort(),ms);
  try{
    const res=await fetch(url,{mode:'cors',signal:ctrl.signal});
    if(!res.ok)return null;
    const blob=await res.blob();
    if(!blob||!blob.type.startsWith('image/'))return null;
    const u=URL.createObjectURL(blob),im=await invLoad(u);
    setTimeout(()=>URL.revokeObjectURL(u),8000);
    return im;
  }catch{return null}finally{clearTimeout(tm)}
}

    lab('Tên khách hàng:',226,c?.name);lab('Điện thoại:',253,c.phone);lab('Địa chỉ:',280,c?.address||c?.area);
  }else{
    lab('Tên khách hàng:',233,c?.name);lab('Địa chỉ:',260,c?.address||c?.area);
  }
  // Mã QR (VietQR động hoặc dự phòng QR tĩnh)
  let dynQr=null,qrStatus='static';
  if(cfg.enabled&&cfg.accNo){
    const info=buildVietQrInfo(o,c);
    const vqUrl=`https://img.vietqr.io/image/${encodeURIComponent(cfg.bank)}-${encodeURIComponent(cfg.accNo)}-qr_only.png?amount=${amt}&addInfo=${encodeURIComponent(info)}${cfg.accName?'&accountName='+encodeURIComponent(cfg.accName):''}`;
    dynQr=await invLoadRemote(vqUrl,3500);
    qrStatus=dynQr?'dynamic':'fallback';
  }
  if(invState)invState.qrStatus=qrStatus;
  const qt=(!dynQr||cfg.keepBanner)?await invLoad(INV_QR):null;
  const qc=dynQr||await invLoad(INV_QRC);
  g.save();g.setTransform(1,0,0,1,0,0);
  const qx=Math.round((P+W-2)*S)-490,qy=Math.round((85+P)*S);
  if(qt){
    g.drawImage(qt,qx,qy,490,150);
  }else{
    const bName=(VQ_BANKS.find(b=>b[0]===cfg.bank)||[0,cfg.bank])[1];
    g.fillStyle='#f4f8ff';g.fillRect(qx,qy,490,150);
    g.strokeStyle='#cfe0ff';g.lineWidth=3;g.strokeRect(qx+1.5,qy+1.5,487,147);
    g.fillStyle='#1d4ed8';g.textAlign='center';g.font='bold 34px '+F;g.fillText('VietQR · '+bName,qx+245,qy+42);
    g.fillStyle='#17243a';g.font='bold 32px '+F;g.fillText('STK: '+cfg.accNo,qx+245,qy+86);
    if(cfg.accName){g.fillStyle='#475569';g.font='bold 25px '+F;g.fillText(cfg.accName.toUpperCase(),qx+245,qy+124)}
  }
  if(qc){g.imageSmoothingEnabled=!!dynQr;g.drawImage(qc,qx,qy+150,490,490)}
  g.restore();
  // Bảng hàng hóa
  g.strokeStyle=B;g.lineWidth=1;
  const hl=(y)=>{g.beginPath();g.moveTo(0,y+.5);g.lineTo(W,y+.5);g.stroke()};
  const vl=(x,y1,y2)=>{g.beginPath();g.moveTo(x+.5,y1);g.lineTo(x+.5,y2);g.stroke()};
  g.fillStyle='#000';g.font='bold 17px '+F;g.textAlign='center';
  ['STT','Tên sản phẩm','ĐVT','Số lượng','Đơn giá','Thành tiền'].forEach((t,i)=>g.fillText(t,(X[i]+X[i+1])/2,topY+headH/2));
  hl(topY);hl(topY+headH);X.forEach(x=>vl(x,topY,topY+headH));
  let y=topY+headH;
  rows.forEach((r,i)=>{
    const cy=y+r.h/2;
    g.fillStyle='#000';g.font=(r.unit.length>6?'13px ':'16px ')+F;g.textAlign='center';
    g.fillText(r.unit,(X[2]+X[3])/2,cy);
    g.font='16px '+F;
    g.fillText(i+1,(X[0]+X[1])/2,cy);g.fillText(fmt(r.qty),(X[3]+X[4])/2,cy);
    g.textAlign='left';const top=cy-(r.name.length-1)*10;r.name.forEach((t,k)=>g.fillText(t,X[1]+4,top+k*20));
    g.textAlign='right';g.fillText(fmt(r.price),X[5]-8,cy);g.fillText(fmt(r.price*r.qty),X[6]-6,cy);
    X.forEach(x=>vl(x,y,y+r.h));hl(y+r.h);
    y+=r.h;
  });
  // Phụ thu
  g.fillStyle='#000';g.font='16px '+F;g.textAlign='center';g.fillText(rows.length+1,(X[0]+X[1])/2,y+surH/2);
  g.textAlign='left';g.fillText('Phụ thu',X[1]+4,y+surH/2);
  g.textAlign='right';if(num(o.surcharge))g.fillText(fmt(o.surcharge),X[6]-6,y+surH/2);
  [0,X[1],X[5],X[6]].forEach(x=>vl(x,y,y+surH));hl(y+surH);y+=surH;
  // Tổng cộng
  g.fillStyle='#000';g.font='bold 17px '+F;g.textAlign='right';
  g.fillText('Tổng cộng',X[5]-3,y+totH/2);g.fillText(fmt(revenue(o)),X[6]-6,y+totH/2);
  [0,X[5],X[6]].forEach(x=>vl(x,y,y+totH));hl(y+totH);y+=totH;
  // Chữ ký
  g.textAlign='center';g.fillStyle='#000';g.font='bold 17px '+F;
  [[211,'Người nhận hàng'],[515,'Nhân viên giao hàng'],[773,'Người bán hàng']].forEach(([x,t])=>g.fillText(t,x,y+38));
  const sg=await invLoad(INV_SIG);if(sg)g.drawImage(sg,773-100,y+84,200,69);
  return cv;
}

async function invRefresh(){
  if(!invState)return;
  invState.canvas=await drawInvoice(invState.o);
  const im=document.getElementById('invPreview');if(im)im.src=invState.canvas.toDataURL('image/png');
  const nt=document.getElementById('invQrNote');
  if(nt){
    nt.innerHTML=invState.qrStatus==='dynamic'
      ?`✅ <strong>VietQR động:</strong> Khách quét tự điền <strong>${money(revenue(invState.o))}</strong> & nội dung CK`
      :invState.qrStatus==='fallback'
      ?`📴 Mạng yếu/Offline: Đang dùng mã QR mặc định có sẵn trên máy`
      :`💡 Đang dùng mã QR tĩnh · Bấm <strong>⚙️ VietQR</strong> bên dưới nếu muốn tự điền số tiền`;

}

function saveInvSettings(returnOrderId=''){
  const enabled=G('vqOn').checked, accNo=G('vqAcc').value.replace(/[^a-zA-Z0-9]/g,'');
  if(enabled&&!accNo)return alert('Vui lòng nhập Số tài khoản để bật VietQR động');
  const cfg={
    enabled, bank:G('vqBank').value, accNo, accName:G('vqName').value.trim(),
    keepBanner:G('vqBanner').checked,
    coName:G('vqCoName').value.trim()||INV_CO.name,
    coAddr:G('vqCoAddr').value.trim()||INV_CO.addr,
    coHot:G('vqCoHot').value.trim()||INV_CO.hot
  };
  localStorage.setItem(VQ_KEY,JSON.stringify(cfg));
  toast('✅ Đã lưu cài đặt Hóa đơn & VietQR!');
  if(returnOrderId) showInvoice(returnOrderId); else { closeModal(); if(page==='settings') render(); }

function invFileName(){
  const o=invState.o,c=customer(o.customerId);
  const slug=String(c?.name||'khach').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/gi,'d').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'');
  return `hoa-don-${slug}-${o.date}.png`;
}
function invDownload(){
  if(!invState||!invState.canvas)return;
  const name=invFileName();
  invState.canvas.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)},'image/png');
}
function invShare(){
  if(!invState||!invState.canvas)return;
  const name=invFileName();
  invState.canvas.toBlob(async b=>{const f=new File([b],name,{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'Hóa đơn'})}catch(e){}}else invDownload()},'image/png');
}

function goCycle(){window.cycleFilter='need';page='cycle';render();scrollTo(0,0)}
function setCycleFilter(v){window.cycleFilter=v;render()}
/* Khách bỏ theo dõi chu kỳ: lưu trên máy này (không đụng bảng khách hàng trên Supabase). Tự theo dõi lại nếu khách có đơn mới. */
const CYC_HIDE_KEY='mysales_cycle_hidden';
function cycHidden(){try{return JSON.parse(localStorage.getItem(CYC_HIDE_KEY)||'{}')}catch(e){return{}}}
function cycSaveHidden(h){try{localStorage.setItem(CYC_HIDE_KEY,JSON.stringify(h))}catch(e){alert('Không lưu được trên máy này')}}
function cycIsHidden(x,h){h=h||cycHidden();return !!h[x.c.id]&&x.last<=h[x.c.id]}
function cycHide(id){
  const c=customer(id),x=c&&cycleInfo(c);if(!x)return;
  if(!confirm('Bỏ '+c.name+' khỏi theo dõi chu kỳ nhập?\nKhách vẫn còn trong danh sách khách hàng và đơn hàng. Nếu khách đặt đơn mới, app sẽ tự theo dõi lại.'))return;
  const h=cycHidden();h[id]=x.last;cycSaveHidden(h);render();
}
function cycShow(id){const h=cycHidden();delete h[id];cycSaveHidden(h);render()}
function cyclePage(){
  const filt=window.cycleFilter||'need';
  const hid=cycHidden();
  const every=db.customers.map(cycleInfo).filter(Boolean);
  const hiddenList=every.filter(x=>cycIsHidden(x,hid)).sort((a,b)=>b.last.localeCompare(a.last));
  const all=every.filter(x=>!cycIsHidden(x,hid));
  all.forEach(x=>x.st=cycleStatus(x));
  const cnt=k=>k==='hidden'?hiddenList.length:all.filter(x=>k==='need'?(x.st==='late'||x.st==='soon'):k==='all'?true:x.st===k).length;
  const rows=filt==='hidden'?hiddenList:all.filter(x=>filt==='need'?(x.st==='late'||x.st==='soon'):filt==='all'?true:x.st===filt)
    .sort((a,b)=>(a.left??9999)-(b.left??9999));
  const fb=(k,t)=>`<button class="${filt===k?'':'secondary'} small" onclick="setCycleFilter('${k}')">${t} (${cnt(k)})</button>`;
  const when=n=>n<0?`trễ ${-n} ngày`:n===0?'hết hôm nay':`còn ${n} ngày`;
  const q=n=>Number(n.toFixed(1)).toLocaleString('vi-VN');
  const tagOf=x=>filt==='hidden'?`<span class="tag">Đã bỏ theo dõi</span>`:x.st==='late'?`<span class="tag bad">Trễ ${-x.left} ngày, gọi ngay</span>`
    :x.st==='soon'?`<span class="tag warn">${x.left===0?'Hôm nay đến hạn':'Còn '+x.left+' ngày là hết'}</span>`
    :x.st==='ok'?`<span class="tag">Còn ${x.left} ngày</span>`
    :`<span class="tag warn">Mới 1 lần nhập</span>`;
  const itemTxt=x=>{
    const top=[...x.items].sort((a,b)=>b[1]-a[1]).slice(0,3).map(([n,v])=>`${esc(n)} ×${Number(v.toFixed(2))}`).join(', ');
    return top+(x.items.length>3?` +${x.items.length-3} món`:'');
  };
  const prodTxt=x=>x.shown.slice(0,3).map(p=>`${esc(p.name)} (${when(p.left)}, thường lấy ~${q(p.qty)})`).join('; ');
  return `<div class="toolbar"><input id="cycleSearch" style="max-width:none;flex:1;min-width:0" placeholder="🔍 Lọc nhanh tên khách, SĐT, mặt hàng..."></div>
  <div class="toolbar">${fb('need','🔔 Cần chuẩn bị')}${fb('late','Trễ hạn')}${fb('ok','Còn hàng')}${fb('new','Chưa đủ dữ liệu')}${fb('all','Tất cả')}${hiddenList.length||filt==='hidden'?fb('hidden','🚫 Đã bỏ theo dõi'):''}</div>
  <div id="cycleRows" class="olist">${rows.length?rows.map(x=>{
    const tel=String(x.c.phone||'').replace(/[^0-9+]/g,'');
    const hide=filt==='hidden';
    return `<div class="orow" data-search="${esc(searchKey(x.c.name,x.c.phone,x.c.area,x.items.map(i=>i[0]).join(' ')))}"><div class="oic">${hide?'🚫':x.st==='late'?'🔴':x.st==='soon'?'🟠':x.st==='ok'?'🟢':'⚪'}</div><div class="omid"><div class="lname">${esc(x.c.name)}</div>
    <div class="lline">🛒 Lần nhập gần nhất ${dateFmt(x.last)} (${x.since} ngày trước): ${itemTxt(x)||'—'}</div>
    ${!hide&&x.byQty?`<div class="lline">📦 ${prodTxt(x)}</div>`:''}
    ${hide?'':`<div class="lline">${x.left===null?'Cần thêm 1 lần nhập nữa để dự báo':`🔄 Dự kiến hết hàng ${x.next.toLocaleDateString('vi-VN')}${x.cycle!==null?` · chu kỳ ~${x.cycle} ngày`:''}`}</div>`}
    <div class="lmeta">${tagOf(x)} ${tel?`<a class="tag" href="tel:${tel}" onclick="event.stopPropagation()">📞 Gọi ${esc(x.c.phone)}</a>`:''}
    ${hide?`<button class="secondary small" onclick="cycShow('${esc(x.c.id)}')">↩ Theo dõi lại</button>`:`<button class="secondary small" onclick="cycHide('${esc(x.c.id)}')">🚫 Bỏ theo dõi</button>`}</div></div></div>`}).join(''):'<div class="notice">Chưa có khách nào ở nhóm này.</div>'}</div>
  <div class="notice" style="margin-top:12px">Dự báo theo từng sản phẩm: lượng khách đã lấy chia cho số ngày đến lần lấy kế tiếp ra mức dùng mỗi ngày (lấy tối đa 5 lần gần nhất). Lượng của lần nhập gần nhất chia mức dùng ra số ngày hàng đủ dùng. Khách lấy nhiều hơn thường lệ sẽ được báo hết muộn hơn, lấy ít hơn thì báo sớm hơn. Món khách đã lâu không lấy (trễ quá gấp đôi số ngày đủ dùng, tối thiểu 7 ngày) được bỏ qua để không báo oan khi khách vẫn đặt các món khác. Sản phẩm mới mua 1 lần chưa dự báo được, khi đó app tính tạm theo chu kỳ ngày. Khách bạn bấm "Bỏ theo dõi" sẽ biến mất khỏi danh sách và trang chủ (chỉ trên máy này), và tự quay lại nếu khách có đơn mới.</div>`;
}

async function saveBus(id){
  const name=G('bName').value.trim();if(!name)return alert('Vui lòng nhập tên nhà xe');
  const data={name,phone:G('bPhone').value.trim(),pickup:G('bPickup').value.trim(),dest:G('bDest').value.trim(),times:[...new Set(busForm.times.filter(Boolean))].sort(),customerIds:[...busForm.cids],note:G('bNote').value.trim(),_u:Date.now()};
  let item;
  if(id){item=busById(id);if(!item)return;Object.assign(item,data)}else{item={id:uid('XE'),...data};busList().push(item)}
  if(!persist())return;
  closeModal();
  showLoading('Đang lưu nhà xe...');
  let msg;
  try{
    msg = await syncFast(pushSingleItem('buses',item), '✅ Đã lưu nhà xe!');
  }finally{hideLoading()}

}
function applyCloudBuses(res, pullStartedAt=Infinity){
  if(!res||res.error||!Array.isArray(res.data))return;
  const cloudBuses=res.data.map(r=>({id:r.id,name:r.name||'',phone:r.phone||'',pickup:r.pickup||'',dest:r.dest||'',times:Array.isArray(r.times)?r.times:[],customerIds:Array.isArray(r.customer_ids)?r.customer_ids:[],note:r.note||'',_u:r._u}));
  const MIG='mysales_buses_migrated';
  if(localStorage.getItem(MIG)==='1'){db.buses=mergeWithLocalPending('buses',cloudBuses,pullStartedAt);return}
  const ids=new Set(cloudBuses.map(b=>b.id)),extra=busList().filter(b=>!ids.has(b.id));
  db.buses=mergeWithLocalPending('buses',[...cloudBuses,...extra],pullStartedAt);
  (async()=>{let ok=true;for(const b of extra){if(!(await pushSingleItem('buses',b)))ok=false}if(ok)try{localStorage.setItem(MIG,'1')}catch(e){}})();
}

function bonusMonths(){
  const set=new Set(db.orders.filter(o=>o.date).map(o=>o.date.slice(0,7)));set.add(today().slice(0,7));
  return [...set].sort().reverse();
}
function setBonusMonth(v){window.bonusMonth=v;render()}
function shiftBonusMonth(d){
  const ms=bonusMonths(),cur=window.bonusMonth||today().slice(0,7);
  if(cur==='all')return;
  const i=ms.indexOf(cur)+d;if(i>=0&&i<ms.length)setBonusMonth(ms[i]);
}
function bonusPage(){
  const ms=bonusMonths(),cur=window.bonusMonth||today().slice(0,7);
  const label=m=>m==='all'?'Tất cả các tháng':`Tháng ${m.slice(5)}/${m.slice(0,4)}`;
  const list=db.orders.filter(o=>o.date&&(cur==='all'||o.date.slice(0,7)===cur));
  const by={};
  list.forEach(o=>{const id=o.customerId||'';const e=by[id]||(by[id]={id,orders:0,revenue:0,profit:0});e.orders++;e.revenue+=revenue(o);e.profit+=orderProfit(o)});
  const rows=Object.values(by).map(e=>{const c=customer(e.id);e.name=c?c.name:'Khách lẻ';return e}).sort((a,b)=>b.profit-a.profit);
  const tp=rows.reduce((s,e)=>s+e.profit,0),tr=rows.reduce((s,e)=>s+e.revenue,0),to=rows.reduce((s,e)=>s+e.orders,0);
  const medal=['🥇','🥈','🥉'];

function openModal(title,html,after){
  document.getElementById('modalTitle').textContent=title;
  document.getElementById('modalBody').innerHTML=html;
  document.getElementById('modal').classList.remove('hidden');
  if(after)after();
}
function closeModal(){document.getElementById('modal').classList.add('hidden')}

/* ================= HIỆU ỨNG MỜ QUAY VÒNG KHI LƯU ================= */
function showLoading(text){
  let ov = G('loadingOverlay'), tx = G('loadingText');
  if(tx) tx.textContent = text || 'Đang lưu & đồng bộ...';
  if(ov) ov.classList.remove('hidden');
}
function hideLoading(){
  let ov = G('loadingOverlay');
  if(ov) ov.classList.add('hidden');
}

function openCustomer(){
  openModal('Thêm khách hàng',`<div class="formgrid"><div class="field"><label>Tên khách hàng *</label><input id="cName" required></div><div class="field"><label>Số điện thoại</label><input id="cPhone" inputmode="tel"></div><div class="field"><label>Khu vực / tỉnh thành</label><input id="cArea" placeholder="Ví dụ: Từ Sơn, Bắc Ninh"></div><div class="field"><label>Địa chỉ chi tiết</label><input id="cAddress"></div><div class="field span2"><label>Ghi chú</label><textarea id="cNote" rows="2"></textarea></div></div><div class="actions"><button class="secondary" onclick="closeModal()">Hủy</button><button onclick="saveCustomer()">Lưu khách hàng</button></div>`);
}

async function saveCustomer(id=null){
  let name=G('cName').value.trim();
  if(!name)return alert('Vui lòng nhập tên khách hàng');
  let data={name,phone:G('cPhone').value.trim(),area:G('cArea').value.trim(),address:G('cAddress').value.trim(),note:G('cNote').value.trim(),_u:Date.now()};
  let item;
  if(id){
    let c=customer(id);if(!c)return alert('Không tìm thấy khách hàng');
    Object.assign(c,data);
    item=c;
  }else{
    item={id:uid('KH'),...data};
    db.customers.push(item);
  }
  if(!persist())return;
  closeModal();
  showLoading('Đang lưu & đồng bộ khách hàng...');
  try {
    let msg = await syncFast(pushSingleItem('customers', item), '✅ Đã lưu khách hàng!');
    render();
    toast(msg);
  } finally {
    hideLoading();
  }
}

function editCustomer(id){
  let c=customer(id);if(!c)return;
  openModal('Chỉnh sửa khách hàng',`<div class="formgrid"><div class="field"><label>Tên khách hàng *</label><input id="cName" required value="${esc(c.name)}"></div><div class="field"><label>Số điện thoại</label><input id="cPhone" inputmode="tel" value="${esc(c.phone||'')}"></div><div class="field"><label>Khu vực / tỉnh thành</label><input id="cArea" value="${esc(c.area||'')}"></div><div class="field"><label>Địa chỉ chi tiết</label><input id="cAddress" value="${esc(c.address||'')}"></div><div class="field span2"><label>Ghi chú</label><textarea id="cNote" rows="2">${esc(c.note||'')}</textarea></div></div>${busNote(id)}<div class="actions"><button class="secondary" onclick="showCustPrices('${esc(id)}')">💲 Bảng giá</button><button class="secondary" onclick="closeModal()">Hủy</button><button onclick="saveCustomer('${esc(id)}')">Lưu thay đổi</button></div>`);
}

function compressProductImage(file){
  return new Promise((resolve,reject)=>{
    let r=new FileReader();
    r.onload=()=>{
      let im=new Image();
      im.onload=()=>{
        let scale=Math.min(1,220/Math.max(im.width,im.height)),c=document.createElement('canvas');
        c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        resolve(c.toDataURL('image/jpeg',0.45));
      };
      im.onerror=reject;im.src=r.result;
    };
    r.onerror=reject;r.readAsDataURL(file);
  });
}

async function del(type,id){
  let warn = 'Bạn chắc chắn muốn xóa mục này?';
  if(type==='customers'){
    let cnt = db.orders.filter(o=>o.customerId===id).length;
    if(cnt>0) warn = `⚠️ Khách hàng này đang có ${cnt} đơn hàng cũ.\nNếu xóa, các đơn đó sẽ chuyển thành "Khách lẻ". Bạn vẫn chắc chắn muốn xóa?`;
  } else if(type==='products'){
    let cnt = db.orders.filter(o=>o.lines.some(l=>l.productId===id)).length;
    if(cnt>0) warn = `Sản phẩm này đã nằm trong ${cnt} đơn hàng cũ (chi tiết đơn cũ vẫn giữ nguyên).\nBạn chắc chắn muốn xóa khỏi danh mục?`;
  }
  if(!confirm(warn))return false;

  closeModal();
  showLoading('Đang xóa & đồng bộ...');
  try {
    let tasks = [];
    if(type==='orders'){
      let linkedIds = db.expenses.filter(e=>e.orderId===id).map(e=>e.id);
      db.expenses=db.expenses.filter(e=>e.orderId!==id);
      for(let eid of linkedIds) tasks.push(deleteRemoteItem('expenses', eid));
    }
    if(type==='customers'){
      for(let b of busList()){
        if(Array.isArray(b.customerIds)&&b.customerIds.includes(id)){
          b.customerIds=b.customerIds.filter(cid=>cid!==id);
          b._u=Date.now();
          tasks.push(pushSingleItem('buses', b));
        }
      }
    }
    db[type]=db[type].filter(x=>x.id!==id);
    persist();
    tasks.push(deleteRemoteItem(type, id));
    let allDone = Promise.all(tasks).then(rs => rs.every(Boolean));
    let msg = await syncFast(allDone, '🗑 Đã xóa thành công!');
    render();
    toast(msg);
    return true;
  } finally {
    hideLoading();
  }
}

async function restore(ev){
  let f=ev.target.files[0];if(!f)return;

  r.onload=async()=>{
    let d;
    try{
      d=JSON.parse(r.result);
      if(!d.orders||!d.customers||!d.products||!d.expenses)throw Error();
      for(const k of ['orders','customers','products','expenses','buses'])if(!Array.isArray(d[k]))d[k]=[];
      d.products=d.products.map(unpackProd);
    }catch{
      ev.target.value='';
      return alert('File sao lưu không hợp lệ');
    }
    if(confirm('Khôi phục sẽ nạp toàn bộ dữ liệu từ file lên đám mây theo lô siêu tốc. Tiếp tục?')){
      saveQueue({u:{},d:{}});

      if(cloudConfigured()){

          showLoading('Đang đẩy dữ liệu khôi phục theo lô (100 mục/lần)...');
          try { await pushAllFromBackup(); } finally { hideLoading(); }
        } else {
          for(const tbl of ['customers','products','orders','expenses','buses']){
            const list=tbl==='buses'?busList():(db[tbl]||[]);
            list.forEach(x=>markDirtyUpsert(tbl,x.id));

          setSync();
        }
      }
      toast('✅ Đã khôi phục dữ liệu xong!', 4500);
    }
    ev.target.value='';
  };
  r.readAsText(f);
}

const COLS=['orders','customers','products','expenses'],CFG_KEY='mysales_supabase_config',MODE_KEY='mysales_offline_mode',OK_KEY='mysales_lastok',QUEUE_KEY='mysales_sync_queue';
const SB_SRC=['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2','https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js'];
let syncState='out',syncMsg='',libLoading=false,lastOk=0,savingOrder=false,editingOrderId=null,flushingQueue=false;
const recentDeletes = new Set();
try{lastOk=Number(localStorage.getItem(OK_KEY))||0}catch{}

const cloudCfg=()=>{try{return JSON.parse(localStorage.getItem(CFG_KEY)||'{}')||{}}catch{return{}}};
const cloudConfigured=()=>{let c=cloudCfg();return !!(c.url&&c.key)};
const isMissingTableErr=err=>/42P01|PGRST205|Could not find the table/i.test((err?.code||'')+' '+(err?.message||''));

function loadQueue(){
  try{ let q=JSON.parse(localStorage.getItem(QUEUE_KEY)||'{}')||{}; return {u:q.u||{},d:q.d||{}}; }
  catch{ return {u:{},d:{}}; }
}
function saveQueue(q){ try{localStorage.setItem(QUEUE_KEY,JSON.stringify(q))}catch{} }
function queueCount(){ let q=loadQueue(); return Object.keys(q.u).length+Object.keys(q.d).length; }
function markDirtyUpsert(table,id){ let q=loadQueue(); q.u[table+':'+id]=1; delete q.d[table+':'+id]; recentDeletes.delete(table+':'+id); saveQueue(q); }
function clearDirtyUpsert(table,id){ let q=loadQueue(); delete q.u[table+':'+id]; saveQueue(q); }
function markDirtyDelete(table,id){ let q=loadQueue(); delete q.u[table+':'+id]; q.d[table+':'+id]=1; recentDeletes.add(table+':'+id); saveQueue(q); }
function clearDirtyDelete(table,id){ let q=loadQueue(); delete q.d[table+':'+id]; saveQueue(q); }

async function syncFast(promise, okMsg, ms=2200){
  if(!cloudConfigured()) return okMsg;
  const res = await Promise.race([
    promise.then(ok=>({finished:true,ok})),
    new Promise(r=>setTimeout(()=>r({finished:false,ok:false}), ms))
  ]);
  if(res.finished && res.ok) return okMsg;
  if(!res.finished) return '⚡ Mạng yếu: Đã lưu trên máy & đang đồng bộ ngầm...';
  if(!navigator.onLine) return '📴 Offline: Đã lưu trên máy, tự đồng bộ khi có mạng';
  return '⚠️ Đã lưu trên máy (chờ đồng bộ lại)';
}

}
function markOk(){lastOk=Date.now();try{localStorage.setItem(OK_KEY,String(lastOk))}catch{}setSync('ok')}
function newId(p){return p+'-'+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,4).toUpperCase()}

function setSync(st,msg){
  if(st){syncState=st;syncMsg=msg||''}
  let b=document.getElementById('syncStat');if(!b)return;
  let pending=queueCount(), s=syncState;
  if(!cloudConfigured()) s='none';
  else if(!navigator.onLine) s='off';
  else if(pending>0 && s!=='busy') s='pending';
  const T={
    ok:['☁ Đã đồng bộ','ok'],
    busy:['☁ Đang đồng bộ…','busy'],
    pending:[`⏳ Chờ đồng bộ (${pending})`,'warn'],
    err:['⚠ Lỗi đồng bộ','err'],
    out:['☁ Chưa đăng nhập','out'],
    none:['☁ Chưa bật đồng bộ','out'],
    nolib:['⚠ Lỗi thư viện','err'],
    off:[`📴 Offline${pending?` (${pending})`:''}`,'warn']
  }[s]||['☁','out'];
  b.textContent=T[0];b.className='syncstat '+T[1];b.title=syncMsg||(pending?`Còn ${pending} mục chờ đẩy lên Cloud`:'');
}

function toCloudRow(table, item){
  let payload = { ...item, user_id: cloudUser.id, updated_at: new Date().toISOString() };
  delete payload._imgSync;
  if(table === 'products') {
    payload.note = packProdNote(item.unit, item.note);
    delete payload.unit;
  }
  if(table === 'orders') {
    payload.customer_id = item.customerId || '';
    payload.ship_fee = num(item.shipFee);
    payload.extra_cost = num(item.extraCost);
    delete payload.customerId; delete payload.shipFee; delete payload.extraCost;
  }
  if(table === 'expenses') {
    payload.order_id = item.orderId || '';
    delete payload.orderId;
  }
  if(table === 'buses') {
    payload.customer_ids = item.customerIds || [];
    delete payload.customerIds;
  }
  return payload;
}

async function pushSingleItem(table, item) {
  if(table==='products') item._imgSync = item._u;
  if(cloudConfigured()) markDirtyUpsert(table, item.id);
  if(!cloudConfigured() || !ensureCloud() || !navigator.onLine) { setSync(); return false; }
  if(!cloudUser && !(await restoreSession())) { setSync('out'); return false; }
  setSync('busy');
  try {
    let { error } = await cloud.from(table).upsert(toCloudRow(table, item));
    if(error) {
      if(table==='buses' && isMissingTableErr(error)) { clearDirtyUpsert(table, item.id); setSync('ok'); return false; }
      throw error;
    }
    clearDirtyUpsert(table, item.id);
    if(queueCount()===0) markOk(); else setSync('pending');
    return true;
  } catch(e) {
    setSync('err', e.message);
    return false;
  }
}

async function deleteRemoteItem(table, id) {
  if(cloudConfigured()) markDirtyDelete(table, id);
  if(!cloudConfigured() || !ensureCloud() || !navigator.onLine) { setSync(); return false; }
  if(!cloudUser && !(await restoreSession())) { setSync('out'); return false; }
  setSync('busy');
  try {
    let { error } = await cloud.from(table).delete().eq('id', id).eq('user_id', cloudUser.id);
    if(error) {
      if(table==='buses' && isMissingTableErr(error)) { clearDirtyDelete(table, id); setSync('ok'); return false; }
      throw error;
    }
    clearDirtyDelete(table, id);
    if(queueCount()===0) markOk(); else setSync('pending');
    return true;
  } catch(e) {
    setSync('err', e.message);
    return false;
  }
}

async function flushSyncQueue(){
  if(flushingQueue || queueCount()===0) return true;
  if(!cloudConfigured() || !ensureCloud() || !navigator.onLine) return false;
  if(!cloudUser && !(await restoreSession())) return false;

  flushingQueue = true;
  setSync('busy');
  try {
    let q = loadQueue();
    const byU = {}, byD = {};
    Object.keys(q.u).forEach(k => { let i=k.indexOf(':'); (byU[k.slice(0,i)]||(byU[k.slice(0,i)]=[])).push(k.slice(i+1)); });
    Object.keys(q.d).forEach(k => { let i=k.indexOf(':'); (byD[k.slice(0,i)]||(byD[k.slice(0,i)]=[])).push(k.slice(i+1)); });

    for(const [tbl, ids] of Object.entries(byU)){
      const list = tbl==='buses' ? busList() : (db[tbl]||[]);
      const items = ids.map(id => list.find(x => x.id===id)).filter(Boolean);
      ids.forEach(id => { if(!list.some(x => x.id===id)) clearDirtyUpsert(tbl, id); });
      for(let i=0; i<items.length; i+=100){
        const chunk = items.slice(i, i+100);
        try {
          const { error } = await cloud.from(tbl).upsert(chunk.map(x => toCloudRow(tbl, x)));
          if(!error || (tbl==='buses' && isMissingTableErr(error))) chunk.forEach(x => clearDirtyUpsert(tbl, x.id));
        } catch {}
      }
    }
    for(const [tbl, ids] of Object.entries(byD)){
      for(let i=0; i<ids.length; i+=100){
        const chunk = ids.slice(i, i+100);
        try {
          const { error } = await cloud.from(tbl).delete().in('id', chunk).eq('user_id', cloudUser.id);
          if(!error || (tbl==='buses' && isMissingTableErr(error))) chunk.forEach(id => clearDirtyDelete(tbl, id));
        } catch {}
      }
    }
    if(queueCount()===0){ markOk(); return true; }
    setSync('pending');
    return false;
  } finally {
    flushingQueue = false;
  }
}

function mergeWithLocalPending(table, cloudItems, pullStartedAt=Infinity){
  const q = loadQueue();
  let filtered = cloudItems.filter(x => !q.d[table+':'+x.id] && !recentDeletes.has(table+':'+x.id));
  const localList = table==='buses' ? busList() : (db[table]||[]);
  const keepLocal = localList.filter(x => q.u[table+':'+x.id] || (num(x._u) >= pullStartedAt));
  if(!keepLocal.length) return filtered;
  const lMap = new Map(keepLocal.map(x => [x.id, x]));
  const seen = new Set();
  let merged = filtered.map(x => {
    if(lMap.has(x.id)){
      const loc = lMap.get(x.id);
      seen.add(x.id);
      return (num(loc._u) >= num(x._u) || q.u[table+':'+x.id]) ? loc : x;
    }
    return x;
  });
  keepLocal.forEach(x => { if(!seen.has(x.id)) merged.push(x); });
  return merged;
}

async function pullLightweightStartup() {
  if(!cloudUser || !ensureCloud() || !navigator.onLine) { setSync(); return; }
  setSync('busy');
  try {
    localStorage.setItem('mysales_uid', cloudUser.id);
    if(queueCount() > 0) await flushSyncQueue();
    const pullStartedAt = Date.now();

    const [resO, resC, resE, resB, resP] = await Promise.all([
      cloud.from('orders').select('*').eq('user_id', cloudUser.id),
      cloud.from('customers').select('*').eq('user_id', cloudUser.id),
      cloud.from('expenses').select('*').eq('user_id', cloudUser.id),
      cloud.from('buses').select('*').eq('user_id', cloudUser.id),
      cloud.from('products').select('id, name, cost, price, note, _u').eq('user_id', cloudUser.id)
    ]);

    if(resO.data) {
      const cloudOrders = resO.data.map(r => ({
        id: r.id, date: r.date, customerId: r.customer_id, lines: r.lines || [],
        surcharge: r.surcharge, shipFee: r.ship_fee, extraCost: r.extra_cost, note: r.note, _u: r._u
      }));
      db.orders = mergeWithLocalPending('orders', cloudOrders, pullStartedAt);
    }
    if(resC.data) db.customers = mergeWithLocalPending('customers', resC.data, pullStartedAt);
    applyCloudBuses(resB, pullStartedAt);
    if(resE.data) {
      const cloudExp = resE.data.map(r => ({
        id: r.id, date: r.date, name: r.name, category: r.category, type: r.type,
        amount: r.amount, orderId: r.order_id, note: r.note, _u: r._u
      }));
      db.expenses = mergeWithLocalPending('expenses', cloudExp, pullStartedAt);
    }

    if(resP.data) {
      let oldMap = new Map(db.products.map(p => [p.id, p]));
      let missingImgIds = [];
      let cloudProds = resP.data.map(raw => {
        let r = unpackProd(raw);
        let localP = oldMap.get(r.id);
        if(localP && localP._u === r._u && (localP.image || localP._imgSync === r._u)) {
          return { ...r, image: localP.image || '', _imgSync: r._u };
        } else {
          missingImgIds.push(r.id);
          return { ...r, image: localP?.image || '' };
        }
      });

      for(let i=0; i<missingImgIds.length; i+=50) {
        const chunkIds = missingImgIds.slice(i, i+50);
        const resImgs = await cloud.from('products').select('id, image').eq('user_id', cloudUser.id).in('id', chunkIds);
        if(resImgs.data && !resImgs.error) {
          const imgMap = new Map(resImgs.data.map(x => [x.id, x.image || '']));
          chunkIds.forEach(id => {
            let target = cloudProds.find(x => x.id === id);
            if(target) {
              if(imgMap.has(id)) target.image = imgMap.get(id);
              target._imgSync = target._u;
            }
          });
        }
      }
      db.products = mergeWithLocalPending('products', cloudProds, pullStartedAt);
    }

    persist();
    render();
    if(queueCount()===0) markOk(); else setSync('pending');
  } catch(e) {
    setSync('err', e.message);
  }
}

async function pushAllFromBackup() {
  if(!cloudUser || !ensureCloud()) return;
  for(const tbl of ['customers','products','orders','expenses','buses']){
    const list = tbl==='buses' ? busList() : (db[tbl]||[]);
    for(let i=0; i<list.length; i+=100){
      const chunk = list.slice(i, i+100);
      try {
        const { error } = await cloud.from(tbl).upsert(chunk.map(x => toCloudRow(tbl, x)));
        if(error && !(tbl==='buses' && isMissingTableErr(error))) chunk.forEach(x => markDirtyUpsert(tbl, x.id));
      } catch {
        chunk.forEach(x => markDirtyUpsert(tbl, x.id));
      }
    }
  }
  setSync();
}

async function saveOrder(){
  if(savingOrder)return;
  let lines=orderLines.filter(l=>l.name.trim()&&qtyVal(l.qty)>0);
  if(!lines.length)return alert('Thêm ít nhất một sản phẩm có tên và số lượng lớn hơn 0');

  const isEdit = !!editingOrderId;
  const data = {
    date:G('oDate').value||today(),
    customerId:G('oCustomer').value,
    lines:lines.map(({manual,cpApplied,cpDate,...l})=>({...l,qty:qtyVal(l.qty)})),
    surcharge:num(G('oSur').value),
    shipFee:num(G('oShip').value),
    extraCost:num(G('oShip').value),
    note:G('oNote').value.trim(),
    _u:Date.now()
  };

  savingOrder = true;
  let btn = document.querySelector('#orderPage .fp-save');
  if(btn) btn.disabled = true;
  showLoading(isEdit ? 'Đang cập nhật đơn hàng...' : 'Đang lưu & đồng bộ đơn hàng...');

  try{
    let o;
    if(isEdit){
      o = db.orders.find(x => x.id === editingOrderId);
      if(!o) return alert('Không tìm thấy đơn hàng cần sửa');
      Object.assign(o, data);
    } else {
      o = { id:newId('DH'), ...data };
      db.orders.push(o);
    }
    if(!persist()) return;
    let msg = await syncFast(
      pushSingleItem('orders', o),
      isEdit ? '✅ Đã cập nhật và đồng bộ đơn hàng!' : '✅ Đã tạo và đồng bộ đơn hàng!'
    );

    render();
    toast(msg);
  }finally{
    savingOrder = false;
    if(btn) btn.disabled = false;
    hideLoading();
  }
}

const lineTotal=l=>money(num(l.price)*qtyVal(l.qty));
function olHtml(l,i){
  let p=product(l.productId),u=unitOf(l),img=p&&p.image?`<img src="${p.image}" alt="">`:'<div class="ph">📦</div>';
  let costVal=l.cost?fmtMoneyInput(l.cost):'', priceVal=(l.price||l.productId)?fmtMoneyInput(l.price):'';
  return `<div class="ol"><div>${img}</div><div><div class="ol-name">${i+1}. ${l.productId?esc(l.name):`<input class="ol-nm" placeholder="Tên sản phẩm ngoài..." value="${esc(l.name)}" oninput="orderLines[${i}].name=this.value">`}</div>
<div class="stepper"><button type="button" onclick="olQty(${i},-1)">−</button><input inputmode="decimal" value="${l.qty}" oninput="olSet(${i},this.value)" onchange="olFix(${i},this)"><button type="button" onclick="olQty(${i},1)">+</button></div> ${l.productId?`<span class="muted">${esc(u)}</span>`:`<input value="${esc(u)}" placeholder="ĐVT" oninput="olUnit(${i},this.value)" style="width:58px;min-height:36px;padding:4px 6px;font-size:14px;text-align:center;border:1px solid #dce2ea;border-radius:8px;vertical-align:middle">`}
${l.productId?'':`<input class="ol-cost" id="olc${i}" inputmode="numeric" placeholder="Giá vốn / 1 ${esc(u)}" value="${costVal}" oninput="orderLines[${i}].cost=num(this.value);updateOrderSummary()">`}<div class="muted" id="olh${i}" style="font-size:12px">${olHint(l)}</div></div>
<div class="ol-price"><button type="button" class="small danger" onclick="olDel(${i})">×</button><div class="ol-total" id="olt${i}">${lineTotal(l)}</div><input class="ol-unit" id="olu${i}" inputmode="numeric" placeholder="đ / 1 ${esc(u)}" value="${priceVal}" oninput="olPrice(${i},this.value)"></div></div>`;
}

function renderOrderLines(){let b=G('orderLines');if(!b)return;b.innerHTML=orderLines.map(olHtml).join('')||'<div class="empty">Chưa có hàng hóa. Bấm “＋ Thêm” để chọn.</div>';updateOrderSummary()}
function olRefresh(i){let t=G('olt'+i);if(t)t.textContent=lineTotal(orderLines[i]);updateOrderSummary()}
function olSet(i,v){orderLines[i].qty=Math.max(0,qtyVal(v));olRefresh(i)}
function olFix(i,el){let q=qtyVal(orderLines[i].qty);if(!(q>0))q=1;orderLines[i].qty=q;el.value=q;olRefresh(i)}
function olQty(i,d){let u=unitOf(orderLines[i]),n=Math.round((qtyVal(orderLines[i].qty)+d)*100)/100;if(n<=0)n=u==='kg'?0.5:1;orderLines[i].qty=n;renderOrderLines()}
function olUnit(i,v){let u=v.trim()||'kg';orderLines[i].unit=u;if(G('olu'+i))G('olu'+i).placeholder='đ / 1 '+u;if(G('olc'+i))G('olc'+i).placeholder='Giá vốn / 1 '+u;updateOrderSummary()}
function olPrice(i,v){orderLines[i].price=num(v);orderLines[i].manual=true;const h=G('olh'+i);if(h)h.textContent='';olRefresh(i)}
function olDel(i){orderLines.splice(i,1);renderOrderLines()}

function updateOrderSummary(){
  let goods=orderLines.reduce((s,l)=>s+qtyVal(l.qty)*num(l.price),0),c=orderLines.reduce((s,l)=>s+qtyVal(l.qty)*num(l.cost),0),sur=num(G('oSur')?.value),ship=num(G('oShip')?.value),total=goods+sur,p=total-c-ship;
  const byU={};orderLines.forEach(l=>{const qv=qtyVal(l.qty);if(qv>0){const u=unitOf(l);byU[u]=(byU[u]||0)+qv}});
  const qTxt=Object.entries(byU).map(([u,v])=>`${(Math.round(v*100)/100).toLocaleString('vi-VN')} ${esc(u)}`).join(' + ')||'0 kg';
  let x=G('orderSummary');if(x)x.innerHTML=`<div class="summaryline"><span>Tổng số lượng</span><strong>${qTxt}</strong></div><div class="summaryline"><span>Tiền hàng</span><strong>${money(goods)}</strong></div><div class="summaryline"><span>Phụ phí</span><strong>+ ${money(sur)}</strong></div><div class="summaryline"><span>Tổng khách trả</span><strong>${money(total)}</strong></div><div class="summaryline"><span>Giá vốn</span><strong>${money(c)}</strong></div><div class="summaryline"><span>Phí vận chuyển</span><strong>− ${money(ship)}</strong></div><div class="summaryline"><strong>Lợi nhuận dự kiến</strong><strong class="${p<0?'negative':'positive'}">${money(p)}</strong></div>`;
  let t=G('ofTotal');if(t)t.textContent=money(total);
}

function openPicker(){pickSel=new Set(orderLines.filter(l=>l.productId).map(l=>l.productId));G('pickQ').value='';G('pickPage').classList.remove('hidden');renderPick()}
function closePicker(){G('pickPage').classList.add('hidden')}
function renderPick(){let q=normText(G('pickQ').value),ps=db.products.filter(p=>!q||searchKey(p.name,p.note,prodUnit(p)).includes(q));
  G('pickList').innerHTML=ps.map(p=>`<div class="pk ${pickSel.has(p.id)?'on':''}" onclick="pickToggle('${esc(p.id)}')"><div class="th">${p.image?`<img src="${p.image}" alt="">`:'📦'}<div class="tick">✓</div></div><div class="nm">${esc(p.name)}</div><div class="pr">${money(p.price)}/${esc(prodUnit(p))}</div></div>`).join('')||'<div class="empty">Không tìm thấy sản phẩm phù hợp.</div>';
  G('pickCount').textContent=pickSel.size}
function pickToggle(id){pickSel.has(id)?pickSel.delete(id):pickSel.add(id);renderPick()}
function pickApply(){orderLines=orderLines.filter(l=>!l.productId||pickSel.has(l.productId));pickSel.forEach(id=>{if(!orderLines.some(l=>l.productId===id)){let p=product(id);if(p)orderLines.push({productId:id,name:p.name,unit:prodUnit(p),qty:1,price:num(p.price),cost:num(p.cost)})}})}
function pickDone(){pickApply();applyCustPrices();closePicker();renderOrderLines()}
function pickCustom(){pickApply();applyCustPrices();orderLines.push({productId:'',name:'',unit:'kg',qty:1,price:0,cost:0});closePicker();renderOrderLines()}

function zoomPanel(){let z=Number(localStorage.getItem('mysales_zoom'))||1;return `<section class="panel" style="margin-bottom:15px"><h2>Cỡ hiển thị trên máy này</h2><div class="toolbar">${[0.8,0.85,0.9,1].map(v=>`<button class="${Math.abs(z-v)<.01?'':'secondary'}" onclick="setZoom(${v})">${Math.round(v*100)}%</button>`).join('')}</div></section>`}
function setZoom(z){localStorage.setItem('mysales_zoom',z);document.body.style.zoom=z;render()}
(function(){let z=Number(localStorage.getItem('mysales_zoom'));if(z>=.7&&z<=1.3)document.body.style.zoom=z})();

function reportRange(mode,a){let d=new Date(a+'T00:00:00');if(mode==='day')return{from:a,to:a};if(mode==='week'){let f=weekStart(a);return{from:f,to:new Date(new Date(f+'T00:00:00').getTime()+6*86400000).toLocaleDateString('sv-SE')}}return{from:new Date(d.getFullYear(),d.getMonth(),1).toLocaleDateString('sv-SE'),to:new Date(d.getFullYear(),d.getMonth()+1,0).toLocaleDateString('sv-SE')}}
function reportShift(n){let m=window.reportMode||'day',d=new Date((window.reportDate||today())+'T00:00:00');if(m==='day')d.setDate(d.getDate()+n);else if(m==='week')d.setDate(d.getDate()+7*n);else{d.setDate(1);d.setMonth(d.getMonth()+n)}window.reportDate=d.toLocaleDateString('sv-SE');render()}
function reportSetMode(m){window.reportMode=m;render()}
function reportSet(v){if(v){window.reportDate=v;render()}}
function reportToday(){window.reportDate=today();render()}
function reportDrill(d){window.reportMode='day';window.reportDate=d;render()}
['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>{if(!e.target.closest?.('.inv-wrap'))e.preventDefault()},{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1&&!e.target.closest?.('.inv-wrap'))e.preventDefault()},{passive:false});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
