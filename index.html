/* Thương hiệu vui nhộn: Kiếm được 10 tỷ sẽ nghỉ làm */
.brand{

/* Lớp phủ mờ toàn màn hình khi đang lưu/đồng bộ */
.loading-overlay {
  position: fixed;
  inset: 0;
  background: rgba(23, 36, 58, 0.55);
  backdrop-filter: blur(2px);
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #fff;
  gap: 14px;
}
.loading-spinner {
  width: 44px;
  height: 44px;
  border: 4px solid rgba(255, 255, 255, 0.25);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
.loading-text {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.2px;
  text-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
.oprofit{font-size:12px;margin-top:1px;white-space:nowrap;margin-left:0!important}

html body .syncstat{margin-left:auto;background:transparent!important;box-shadow:none;font-size:12px!important;font-weight:700;min-height:32px!important;padding:4px 8px!important;border-radius:8px;white-space:nowrap}
.syncstat.ok{color:#18a875!important}.syncstat.busy{color:#3478ee!important}.syncstat.err{color:#d64545!important}.syncstat.out{color:#8b98aa!important}
</style>
<style id="final-ui">
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom));width:max-content;max-width:88vw;background:#17243a;color:#fff;padding:10px 14px;border-radius:12px;font-size:13px;z-index:95;box-shadow:0 6px 20px #0004;text-align:center;line-height:1.4}
.syncstat.warn{color:#e08a00!important}
</style>
</head>
<body><div class="app">
<div class="topbar"><button id="menuBtn" class="menu-btn" aria-label="Mở menu" aria-expanded="false"><span></span><span></span><span></span></button><span class="tb-brand">🤑 Kiếm được 10 tỷ sẽ nghỉ làm</span><button id="syncStat" type="button" class="syncstat out">☁</button></div><div id="drawerBg" class="drawer-bg hidden"></div><aside id="drawer" class="drawer"><div class="drawer-head">🤑 Kiếm được 10 tỷ sẽ nghỉ làm<small>Làm hết mình, nghỉ hưu thật sớm 😎</small></div><nav class="menu"><button class="active" data-page="dashboard">▦ Tổng quan</button><button data-page="orders">▤ Đơn hàng</button><button data-page="customers">♙ Khách hàng</button><button data-page="cycle">🔄 Chu kỳ nhập</button><button data-page="bonus">💖 Các khách YÊU bonus</button><button data-page="products">▣ Sản phẩm</button><button data-page="expenses">＋ Chi phí</button><button data-page="reports">▥ Báo cáo</button><button data-page="settings">⚙ Dữ liệu</button></nav><div class="drawer-note">💸 Mục tiêu: 10 tỷ rồi tính tiếp!</div></aside>
<main class="main"><header class="app-topbar"><div class="searchbox">⌕ <input id="globalSearch" placeholder="Tìm kiếm đơn hàng, khách hàng, sản phẩm..."></div><div class="profile-chip"><span class="profile-avatar">M</span><span><strong>Team nghỉ hưu sớm 😎</strong><small>Quản lý bán hàng</small></span></div></header><div class="top"><div><div class="muted" id="today"></div><h1 id="pageTitle">Tổng quan</h1></div><button id="quickAdd">＋ Tạo đơn hàng</button></div><div id="page"></div></main></div>
<div id="modal" class="modal hidden"><div class="dialog"><div class="dialoghead"><h2 id="modalTitle"></h2><button class="secondary small" id="closeModal">✕</button></div><div id="modalBody"></div></div></div>
<div id="toast" class="toast hidden" role="status"></div>
<div id="loadingOverlay" class="loading-overlay hidden">
  <div class="loading-spinner"></div>
  <div id="loadingText" class="loading-text">Đang lưu & đồng bộ đơn hàng...</div>
</div>
<div id="orderPage" class="fp hidden"></div>
<div id="pickPage" class="fp hidden" style="z-index:75"><div class="fp-head"><button type="button" onclick="closePicker()" aria-label="Quay lại">‹</button><h2>Chọn hàng hóa</h2></div><div class="fp-search"><input id="pickQ" placeholder="Lọc theo tên hàng..." oninput="renderPick()"></div><div class="fp-body" id="pickList"></div><div class="fp-foot"><button type="button" class="secondary" onclick="pickCustom()">＋ Sản phẩm ngoài</button><button type="button" onclick="pickDone()">Tiếp tục (<span id="pickCount">0</span>)</button></div></div>
<script>
const KEY='mysales_v1';
let db=load();
let page='dashboard';
let orderLines=[];
let cloud=null,cloudUser=null,cloudBusy=false;

function load(){
  let raw=null;
  try{
    raw=localStorage.getItem(KEY);
    let d=JSON.parse(raw)||{};
    for(const k of ['orders','customers','products','expenses'])if(!Array.isArray(d[k]))d[k]=[];
    return d;
  }catch{
    return{orders:[],customers:[],products:[],expenses:[]};
  }
}

const money=n=>(Number(n)||0).toLocaleString('vi-VN')+'\u00a0₫';
const num=v=>Number(String(v??'').replace(/[^0-9-]/g,''))||0;
const qtyVal=v=>{let n=parseFloat(String(v??'').replace(',','.'));return Number.isFinite(n)?n:0};
const fmtMoneyInput=v=>{let d=String(v??'').replace(/[^0-9]/g,'');return d?d.replace(/\B(?=(\d{3})+(?!\d))/g,'.'):''};

document.addEventListener('input',e=>{
  if(e.target.matches('[data-money],#pCost,#pPrice,#eAmount,#oExtra')||((e.target.tagName==='INPUT')&&e.target.inputMode==='numeric'&&e.target.title!=='Số lượng'&&!e.target.title?.includes('Số lượng'))){
    let el=e.target,old=el.value,next=fmtMoneyInput(old);
    if(next!==old){el.value=next;try{el.setSelectionRange(next.length,next.length)}catch(_){}}
  }
});

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toLocaleDateString('sv-SE');
const dateFmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString('vi-VN'):'—';

function customer(id){return db.customers.find(x=>x.id===id)}
function product(id){return db.products.find(x=>x.id===id)}
function orderProfit(o){return o.lines.reduce((s,l)=>s+(num(l.price)-num(l.cost))*qtyVal(l.qty),0)+num(o.surcharge)-num(o.extraCost)-expensesTotal(db.expenses.filter(e=>e.orderId===o.id))}
function revenue(o){return o.lines.reduce((s,l)=>s+num(l.price)*qtyVal(l.qty),0)+num(o.surcharge)}
function cost(o){return o.lines.reduce((s,l)=>s+num(l.cost)*qtyVal(l.qty),0)}
function expensesTotal(list){return list.reduce((s,x)=>s+num(x.amount),0)}
function inRange(d,from,to){return d>=from&&d<=to}
function weekStart(d){let x=new Date(d+'T00:00:00');let day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return x.toLocaleDateString('sv-SE')}
function totals(orders,expenses){let r=orders.reduce((s,o)=>s+revenue(o),0),c=orders.reduce((s,o)=>s+cost(o),0),e=expensesTotal(expenses)+orders.reduce((s,o)=>s+num(o.extraCost),0);return{r,c,e,p:r-c-e,n:orders.length}}

function render(){
  document.getElementById('quickAdd').classList.toggle('hidden',page!=='dashboard');
  document.getElementById('today').textContent=new Date().toLocaleDateString('vi-VN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  document.getElementById('pageTitle').textContent=({dashboard:'Tổng quan',orders:'Đơn hàng',customers:'Khách hàng',cycle:'Chu kỳ nhập hàng',bonus:'Các khách YÊU bonus',products:'Sản phẩm',expenses:'Chi phí',reports:'Báo cáo',settings:'Dữ liệu'})[page];
  document.querySelectorAll('.menu button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
  let el=document.getElementById('page');
  el.innerHTML=({dashboard:dashboardPage,orders:ordersPage,customers:customersPage,cycle:cyclePage,bonus:bonusPage,products:productsPage,expenses:expensesPage,reports:reportsPage,settings:settingsPage})[page]();
}

function metric(label,value,note='',ico='•',tone='blue'){
  return `<div class="card metric-card"><div class="metric-top"><div class="metric-label">${label}</div><span class="metric-icon ${tone}">${ico}</span></div><div class="metric">${value}</div><div class="metric-note">${note}</div></div>`;
}

function analyticsChart(data,series,compact=false){
  if(!data.length)return '<div class="empty">Chưa có dữ liệu để vẽ biểu đồ.</div>';
  const W=820,H=compact?190:250,L=58,R=18,T=18,B=38,innerW=W-L-R,innerH=H-T-B;
  const vals=data.flatMap(d=>series.map(z=>num(d[z.key]))),lo=Math.min(0,...vals),hi=Math.max(1,...vals),pad=(hi-lo)*.12||1,min=lo-pad,max=hi+pad;
  const x=i=>L+(data.length===1?innerW/2:i*innerW/(data.length-1)),y=v=>T+(max-v)/(max-min)*innerH;
  let grid='';for(let i=0;i<5;i++){let v=max-(max-min)*i/4,yy=y(v);grid+=`<line class="chart-gridline" x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}"/><text class="chart-axis" x="${L-8}" y="${yy+3}" text-anchor="end">${Math.abs(v)>=1000000?(v/1000000).toFixed(1)+'tr':Math.abs(v)>=1000?Math.round(v/1000)+'k':Math.round(v)}</text>`}
  const bars=series.filter(z=>z.type==='bar'),barW=Math.min(compact?25:34,innerW/Math.max(data.length,1)*.42);
  const chartAmount=v=>{let n=Math.round(num(v)),a=Math.abs(n);if(a>=1000000)return (n/1000000).toLocaleString('vi-VN',{maximumFractionDigits:1})+'tr';if(a>=1000)return (n/1000).toLocaleString('vi-VN',{maximumFractionDigits:1})+'k';return String(n)};
  let shapes=data.map((d,i)=>{let group=bars.length,each=barW/Math.max(group,1);return bars.map((z,j)=>{let xx=x(i)+(j-(group-1)/2)*each-each/2,yy=y(num(d[z.key])),base=y(0),top=Math.min(yy,base);return `<rect x="${xx}" y="${top}" width="${each*.82}" height="${Math.max(1,Math.abs(base-yy))}" rx="3" fill="${z.color}"><title>${z.label}: ${money(d[z.key])}</title></rect>`}).join('')}).join('');
  let lines=series.filter(z=>z.type!=='bar').map((z,zi)=>{let pts=data.map((d,i)=>`${x(i)},${y(num(d[z.key]))}`).join(' ');let dots=data.map((d,i)=>{let cy=y(num(d[z.key])),labelY=Math.min(H-B-16,cy+18+(zi*10));return `<circle class="chart-point" cx="${x(i)}" cy="${cy}" r="3.5" fill="${z.color}"><title>${z.label}: ${money(d[z.key])}</title></circle><text x="${x(i)}" y="${labelY}" text-anchor="middle" class="chart-value-label" fill="${z.color}">${chartAmount(d[z.key])}</text>`}).join('');return `<polyline class="chart-line" stroke="${z.color}" points="${pts}"/>${dots}`}).join('');
  let labels=data.map((d,i)=>`<text class="chart-axis" x="${x(i)}" y="${H-10}" text-anchor="middle">${esc(d.label)}</text>`).join('');
  return `<div class="analytics-chart ${compact?'compact-chart':''}"><svg viewBox="0 0 ${W} ${H}" role="img">${grid}${shapes}${lines}${labels}</svg></div><div class="analytics-legend">${series.map(z=>`<span><i class="legend-dot" style="background:${z.color}"></i>${z.label}</span>`).join('')}</div>`;
}

function expenseBreakdown(orders,expenses){
  let ads=expensesTotal(expenses.filter(e=>(e.type||(e.category==='Quảng cáo'?'ads':'other'))==='ads'));
  let other=expensesTotal(expenses.filter(e=>(e.type||(e.category==='Quảng cáo'?'ads':'other'))!=='ads'))+orders.reduce((a,o)=>a+num(o.extraCost),0);
  return{ads,other};
}

function dashboardPage(){
  let now=today(),month=now.slice(0,7);
  let mo=db.orders.filter(o=>o.date.startsWith(month));
  let me=db.expenses.filter(e=>e.date.startsWith(month)),mt=totals(mo,me),mb=expenseBreakdown(mo,me);
  let recent=[...db.orders].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
  let overdue=db.customers.map(cycleInfo).filter(Boolean).filter(x=>!cycIsHidden(x)).map(x=>{x.st=cycleStatus(x);return x}).filter(x=>x.st==='late'||x.st==='soon'||(x.st==='new'&&x.since>=30)).sort((a,b)=>(a.left??9999)-(b.left??9999));
  let days=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);let k=d.toLocaleDateString('sv-SE'),os=db.orders.filter(o=>o.date===k),es=db.expenses.filter(e=>e.date===k);let t=totals(os,es);return{key:k,label:k.slice(8)+'/'+k.slice(5,7),...t,totalCost:t.c+t.e}});
  const rp=[{key:'r',label:'Doanh số',color:'#3478ee',type:'bar'},{key:'totalCost',label:'Chi phí',color:'#f29b38',type:'bar'},{key:'p',label:'Lợi nhuận',color:'#18a875',type:'line'}];
  const srow=(lab,n)=>{let d=new Date();d.setDate(d.getDate()-n);let f=d.toLocaleDateString('sv-SE'),t=totals(db.orders.filter(o=>inRange(o.date,f,now)),db.expenses.filter(e=>inRange(e.date,f,now)));return `<tr><td>${lab}</td><td>${money(t.r)}</td><td class="${t.p<0?'negative':'positive'}">${money(t.p)}</td></tr>`};
  return `<div class="dash">
  <details class="fold d-fin" open><summary>📅 Tài chính tháng này</summary><div class="fold-body"><div class="fin-grid"><div><small>Doanh thu</small><strong class="rev">${money(mt.r)}</strong></div><div><small>Lợi nhuận</small><strong class="${mt.p<0?'negative':'positive'}">${money(mt.p)}</strong></div></div>
  <div class="summary-stat"><span>Số đơn hàng</span><strong>${mo.length}</strong></div><div class="summary-stat"><span>Giá vốn hàng bán</span><strong>${money(mt.c)}</strong></div><div class="summary-stat"><span>Chi phí quảng cáo</span><strong>${money(mb.ads)}</strong></div><div class="summary-stat"><span>Chi phí khác</span><strong>${money(mb.other)}</strong></div>
  <button class="secondary full-btn" onclick="page='reports';render()">Xem báo cáo chi tiết →</button></div></details>
  <details class="fold d-chart" open><summary>📊 Biểu đồ 7 ngày gần đây</summary><div class="fold-body">${analyticsChart(days,rp,true)}</div></details>
  <details class="fold d-stat" open><summary>📋 Thống kê</summary><div class="fold-body"><div class="tablewrap"><table class="stat-table"><thead><tr><th>--</th><th>Doanh thu</th><th>Lợi nhuận</th></tr></thead><tbody>${srow('Hôm nay',0)}${srow('7 ngày',6)}${srow('30 ngày',29)}</tbody></table></div></div></details>
  <details class="fold d-recent" open><summary>🧾 Đơn hàng gần đây</summary><div class="fold-body">${recent.length?`<div class="tablewrap"><table><thead><tr><th>Ngày</th><th>Khách hàng</th><th>Doanh thu</th><th>Lợi nhuận</th></tr></thead><tbody>${recent.map(o=>`<tr><td>${dateFmt(o.date)}</td><td><strong>${esc(customer(o.customerId)?.name||'Khách lẻ')}</strong></td><td>${money(revenue(o))}</td><td class="${orderProfit(o)<0?'negative':'positive'}">${money(orderProfit(o))}</td></tr>`).join('')}</tbody></table></div><button class="link-btn" onclick="page='orders';render()">Xem tất cả →</button>`:'<div class="empty">Chưa có đơn hàng. Hãy tạo đơn đầu tiên.</div>'}</div></details>
  <details class="fold d-care" open><summary>📞 Khách chuẩn bị & đã trễ${overdue.length?` (${overdue.length})`:''}</summary><div class="fold-body">${overdue.length?overdue.slice(0,8).map(x=>{const tel=String(x.c.phone||'').replace(/[^0-9+]/g,'');const tg=x.st==='late'?`<span class="tag bad">Trễ ${-x.left} ngày</span>`:x.st==='soon'?`<span class="tag warn">${x.left===0?'Hôm nay':'Còn '+x.left+' ngày'}</span>`:`<span class="tag warn">${x.since} ngày chưa mua</span>`;return `<div class="customerbox"><div><strong>${esc(x.c.name)}</strong><div class="muted">${esc(x.c.area||x.c.address||'Chưa có địa chỉ')}</div></div><div style="display:flex;gap:6px;align-items:center">${tg}${tel?`<a class="tag" href="tel:${tel}" style="text-decoration:none">📞</a>`:''}</div></div>`}).join('')+(overdue.length>8?`<button class="secondary small" style="margin-top:8px;width:100%" onclick="goCycle()">Xem tất cả ${overdue.length} khách</button>`:`<button class="secondary small" style="margin-top:8px;width:100%" onclick="goCycle()">Xem chu kỳ nhập hàng</button>`):'<div class="empty">Chưa có khách nào sắp hết hàng hoặc trễ hạn.</div>'}</div></details>
  </div>`;
}

function ordersPage(){
  let rows=db.orders.map((o,i)=>({o,i})).sort((a,b)=>b.o.date.localeCompare(a.o.date)||b.i-a.i).map(x=>x.o);
  return `<div class="toolbar"><input id="orderSearch" style="max-width:none;flex:1" placeholder="🔍 Lọc theo mã đơn hàng, tên khách, sản phẩm..."></div><div id="orderRows" class="olist">${rows.map(orderRow).join('')||'<div class="empty">Chưa có đơn hàng</div>'}</div>`;
}

function orderRow(o){
  let c=customer(o.customerId)?.name||'Khách lẻ';
  return `<div class="orow order-row" tabindex="0" role="button" onclick="showOrderDetail('${esc(o.id)}')" data-search="${esc((c+' '+o.id+' '+o.lines.map(l=>l.name).join(' ')).toLowerCase())}"><div class="oic">🧾</div><div class="omid"><div class="ocus">${esc(c)}</div><div class="ocode">${esc(o.id)}</div></div><div class="oright"><div class="odate">${dateFmt(o.date)}</div><div class="oamt">${money(revenue(o))}</div><div class="oprofit ${orderProfit(o)<0?'negative':'positive'}">Lãi ${money(orderProfit(o))}</div></div></div>`;
}

function showOrderDetail(id){
  let o=db.orders.find(x=>x.id===id);if(!o)return;
  let c=customer(o.customerId),linked=db.expenses.filter(e=>e.orderId===o.id),extra=num(o.extraCost),rev=revenue(o),baseCost=cost(o),linkedCost=expensesTotal(linked),profit=orderProfit(o);
  openModal('Chi tiết đơn hàng',`<div class="order-detail"><div class="order-detail-head"><div><div class="muted">Mã đơn hàng</div><strong class="order-code">${esc(o.id)}</strong></div><span class="tag">${dateFmt(o.date)}</span></div><section class="detail-section"><h3>Khách hàng</h3><div class="detail-grid"><div><small>Tên khách hàng</small><strong>${esc(c?.name||'Khách lẻ / chưa lưu')}</strong></div><div><small>Số điện thoại</small><strong>${esc(c?.phone||'—')}</strong></div><div><small>Khu vực</small><strong>${esc(c?.area||'—')}</strong></div><div><small>Địa chỉ</small><strong>${esc(c?.address||'—')}</strong></div></div></section><section class="detail-section"><h3>Sản phẩm trong đơn (${o.lines.length})</h3><div class="tablewrap"><table class="detail-lines"><thead><tr><th>Sản phẩm</th><th>SL</th><th>Đơn giá</th><th>Giá vốn/đv</th><th>Thành tiền</th></tr></thead><tbody>${o.lines.map(l=>`<tr><td><strong>${esc(l.name)}</strong></td><td>${qtyVal(l.qty)}</td><td>${money(l.price)}</td><td>${money(l.cost)}</td><td><strong>${money(num(l.price)*qtyVal(l.qty))}</strong></td></tr>`).join('')}</tbody></table></div></section><section class="detail-section"><h3>Tổng kết tài chính</h3><div class="summaryline"><span>Doanh thu</span><strong>${money(rev)}</strong></div>${num(o.surcharge)?`<div class="summaryline"><span>Phụ phí (đã tính trong doanh thu)</span><strong>${money(o.surcharge)}</strong></div>`:''}<div class="summaryline"><span>Giá vốn hàng bán</span><strong>${money(baseCost)}</strong></div><div class="summaryline"><span>${o.shipFee!==undefined?'Phí vận chuyển':'Chi phí riêng của đơn'}</span><strong>${money(extra)}</strong></div><div class="summaryline"><span>Chi phí khác gắn với đơn</span><strong>${money(linkedCost)}</strong></div><div class="summaryline detail-profit"><strong>Lợi nhuận thực tế</strong><strong class="${profit<0?'negative':'positive'}">${money(profit)}</strong></div></section>${linked.length?`<section class="detail-section"><h3>Các khoản chi gắn với đơn</h3>${linked.map(e=>`<div class="summaryline"><span>${esc(e.name)} · ${dateFmt(e.date)}</span><strong>${money(e.amount)}</strong></div>`).join('')}</section>`:''}<section class="detail-section"><h3>Ghi chú</h3><p>${esc(o.note||'Không có ghi chú')}</p></section><div class="actions"><button class="secondary" onclick="closeModal()">Đóng</button><button onclick="showInvoice('${esc(o.id)}')">🧾 Tạo hóa đơn</button><button class="danger" onclick="if(confirm('Bạn chắc chắn muốn xóa đơn hàng này?')){del('orders','${esc(o.id)}');closeModal()}">Xóa đơn hàng</button></div></div>`);
}

function customersPage(){
  let filt=window.customerFilter||'all';
  let rows=db.customers.map(c=>{let os=db.orders.filter(o=>o.customerId===c.id),last=os.map(o=>o.date).sort().at(-1),days=last?Math.floor((Date.now()-new Date(last+'T00:00:00'))/86400000):null;return{c,os,last,days}}).filter(x=>filt==='all'||(filt==='never'&&x.days===null)||(filt!=='never'&&x.days!==null&&x.days>=Number(filt))).sort((a,b)=>(b.days??-1)-(a.days??-1));

/* ===== Chu kỳ nhập hàng của khách ===== */
function cycleInfo(c){
  const os=db.orders.filter(o=>o.customerId===c.id&&o.date);
  const dates=[...new Set(os.map(o=>o.date))].sort();
  if(!dates.length)return null;
  const DAY=86400000,D=d=>new Date(d+'T00:00:00'),T0=D(today());
  const diff=(a,b)=>Math.round((D(a)-D(b))/DAY);
  const med=a=>{const r=[...a].sort((x,y)=>x-y),n=r.length;return n%2?r[(n-1)/2]:(r[n/2-1]+r[n/2])/2};
  const last=dates.at(-1),since=Math.round((T0-D(last))/DAY);
  // 1) Chu kỳ theo ngày (dự phòng khi chưa đủ dữ liệu theo sản phẩm)
  const gaps=[];for(let i=1;i<dates.length;i++){const g=diff(dates[i],dates[i-1]);if(g>0)gaps.push(g)}
  const cycle=gaps.length?Math.round(med(gaps.slice(-5))):null;
  const dateLeft=cycle===null?null:cycle-since;
  // 2) Dự báo theo từng sản phẩm: lượng dùng mỗi ngày = lượng đã lấy / số ngày đến lần lấy kế tiếp
  const byP={};
  os.forEach(o=>o.lines.forEach(l=>{const k=String(l.name||'').trim().toLowerCase(),q=qtyVal(l.qty);if(!k||!(q>0))return;const e=byP[k]||(byP[k]={name:l.name,days:{}});e.days[o.date]=(e.days[o.date]||0)+q}));
  const prods=Object.values(byP).map(e=>{
    const ds=Object.keys(e.days).sort(),qs=ds.map(d=>e.days[d]);
    const r={name:e.name,qty:med(qs.slice(-5)),left:null,last:ds.at(-1)};
    let sq=0,sd=0;
    for(let i=Math.max(0,ds.length-5);i<ds.length-1;i++){const g=diff(ds[i+1],ds[i]);if(g>0){sq+=qs[i];sd+=g}}
    if(sq>0&&sd>0){const sp=diff(today(),ds.at(-1));r.rate=sq/sd;r.cover=qs.at(-1)/r.rate;r.left=Math.round(r.cover-sp);r.stopped=sp>Math.max(2*r.cover,7)}
    return r;
  }).sort((a,b)=>(a.left??9999)-(b.left??9999));
  const known=prods.filter(p=>p.left!==null);
  const active=known.filter(p=>!p.stopped),shown=active.length?active:known; // bỏ qua món khách đã ngừng lấy (trễ quá gấp đôi chu kỳ dùng)
  const left=shown.length?shown[0].left:dateLeft;
  const items={};
  os.filter(o=>o.date===last).forEach(o=>o.lines.forEach(l=>{items[l.name]=(items[l.name]||0)+qtyVal(l.qty)}));
  const next=left===null?null:new Date(T0.getTime()+left*DAY);
  return{c,last,cycle,since,left,items:Object.entries(items),next,count:dates.length,prods,shown,byQty:known.length>0};
}
function cycleStatus(x){
  if(x.left===null)return'new';
  if(x.left<0)return'late';
  if(x.left<=3)return'soon';
  return'ok';
}

async function drawInvoice(o){
  const W=938,S=3,F='Roboto,"Segoe UI",Arial,sans-serif',c=customer(o.customerId);
  const X=[0,88,421,494,608,772,937],fmt=n=>Number(n||0).toLocaleString('vi-VN'),B='#a2abc0';
  const m=document.createElement('canvas').getContext('2d');m.font='16px '+F;
  const wrap=(t,w)=>{const out=[];let cur='';String(t||'').split(/\s+/).forEach(wd=>{const test=cur?cur+' '+wd:wd;if(cur&&m.measureText(test).width>w){out.push(cur);cur=wd}else cur=test});if(cur)out.push(cur);return out.length?out:['']};
  const rows=o.lines.map(l=>({name:wrap(l.name,X[2]-X[1]-14),qty:qtyVal(l.qty),price:num(l.price)}));
  rows.forEach(r=>r.h=Math.max(27,r.name.length*20+8));
  const P=28,topY=308,headH=27,surH=27,totH=27,footH=172;
  const rowsH=rows.reduce((s,r)=>s+r.h,0),H=topY+headH+rowsH+surH+totH+footH+2*P,CW=W+2*P;
  const cv=document.createElement('canvas');cv.width=CW*S;cv.height=H*S;
  const g=cv.getContext('2d');g.scale(S,S);g.textBaseline='middle';
  g.fillStyle='#fff';g.fillRect(0,0,CW,H);g.translate(P,P);
  // Đầu trang
  g.fillStyle='#000';g.textAlign='center';
  g.font='bold 20px '+F;g.fillText(INV_CO.name,W/2,14);
  g.font='18px '+F;g.fillText(INV_CO.addr,W/2,41);g.fillText(INV_CO.hot,W/2,68);
  // Tiêu đề
  g.font='bold 25px '+F;g.fillText('ĐƠN ĐẶT HÀNG',W/2,124);
  const d=(o.date||today()).split('-');
  g.font='italic 17px '+F;g.fillText(`Ngày ${+d[2]} tháng ${+d[1]} năm ${d[0]}`,W/2,155);
  g.textAlign='right';g.font='bold 17px '+F;g.fillText('QR thanh toán',735,206);
  g.fillStyle='#3d7be0';g.beginPath();g.roundRect?g.roundRect(741,197,22,18,3):g.rect(741,197,22,18);g.fill();
  g.strokeStyle='#fff';g.lineWidth=2;g.lineCap='round';g.lineJoin='round';g.beginPath();g.moveTo(745,206);g.lineTo(759,206);g.moveTo(754,201);g.lineTo(759,206);g.lineTo(754,211);g.stroke();
  // Khách hàng
  g.textAlign='left';g.fillStyle='#000';
  const lab=(t,y,v)=>{g.font='bold 17px '+F;g.fillText(t,4,y);const w=g.measureText(t).width;g.font='17px '+F;let s=String(v||''),max=768-(4+w+8);while(s.length>1&&g.measureText(s).width>max)s=s.slice(0,-1);if(s!==String(v||''))s=s.trim()+'…';g.fillText(s,4+w+8,y)};
  lab('Tên khách hàng:',233,c?.name);lab('Địa chỉ:',260,c?.address||c?.area);
  const qt=await invLoad(INV_QR),qc=await invLoad(INV_QRC);
  g.save();g.setTransform(1,0,0,1,0,0);
  const qx=Math.round((P+W-2)*S)-490,qy=Math.round((85+P)*S);
  if(qt)g.drawImage(qt,qx,qy,490,150);
  if(qc){g.imageSmoothingEnabled=false;g.drawImage(qc,qx,qy+150,490,490)}
  g.restore();
  // Bảng
  g.strokeStyle=B;g.lineWidth=1;
  const hl=(y)=>{g.beginPath();g.moveTo(0,y+.5);g.lineTo(W,y+.5);g.stroke()};
  const vl=(x,y1,y2)=>{g.beginPath();g.moveTo(x+.5,y1);g.lineTo(x+.5,y2);g.stroke()};
  g.fillStyle='#000';g.font='bold 17px '+F;g.textAlign='center';
  ['STT','Tên sản phẩm','ĐVT','Số lượng','Đơn giá','Thành tiền'].forEach((t,i)=>g.fillText(t,(X[i]+X[i+1])/2,topY+headH/2));
  hl(topY);hl(topY+headH);X.forEach(x=>vl(x,topY,topY+headH));
  let y=topY+headH;
  rows.forEach((r,i)=>{
    const cy=y+r.h/2;
    g.fillStyle='#000';g.font='16px '+F;g.textAlign='center';
    g.fillText(i+1,(X[0]+X[1])/2,cy);g.fillText('kg',(X[2]+X[3])/2,cy);g.fillText(fmt(r.qty),(X[3]+X[4])/2,cy);
    g.textAlign='left';const top=cy-(r.name.length-1)*10;r.name.forEach((t,k)=>g.fillText(t,X[1]+4,top+k*20));
    g.textAlign='right';g.fillText(fmt(r.price),X[5]-8,cy);g.fillText(fmt(r.price*r.qty),X[6]-6,cy);
    X.forEach(x=>vl(x,y,y+r.h));hl(y+r.h);
    y+=r.h;
  });
  // Phụ thu
  g.fillStyle='#000';g.font='16px '+F;g.textAlign='center';g.fillText(rows.length+1,(X[0]+X[1])/2,y+surH/2);
  g.textAlign='left';g.fillText('Phụ thu',X[1]+4,y+surH/2);
  g.textAlign='right';if(num(o.surcharge))g.fillText(fmt(o.surcharge),X[6]-6,y+surH/2);
  [0,X[1],X[5],X[6]].forEach(x=>vl(x,y,y+surH));hl(y+surH);y+=surH;
  // Tổng cộng
  g.fillStyle='#000';g.font='bold 17px '+F;g.textAlign='right';
  g.fillText('Tổng cộng',X[5]-3,y+totH/2);g.fillText(fmt(revenue(o)),X[6]-6,y+totH/2);
  [0,X[5],X[6]].forEach(x=>vl(x,y,y+totH));hl(y+totH);y+=totH;
  // Chữ ký
  g.textAlign='center';g.fillStyle='#000';g.font='bold 17px '+F;
  [[211,'Người nhận hàng'],[515,'Nhân viên giao hàng'],[773,'Người bán hàng']].forEach(([x,t])=>g.fillText(t,x,y+38));
  const sg=await invLoad(INV_SIG);if(sg)g.drawImage(sg,773-100,y+84,200,69);
    return cv;
}
async function invRefresh(){
  if(!invState)return;
  invState.canvas=await drawInvoice(invState.o);
  const im=document.getElementById('invPreview');if(im)im.src=invState.canvas.toDataURL('image/png');
}
function showInvoice(id){
  const o=db.orders.find(x=>x.id===id);if(!o)return;
  invState={o,canvas:null};
  const canShare=!!(navigator.canShare&&navigator.share);
  openModal('Hóa đơn gửi khách',`<div class="inv-wrap"><img id="invPreview" alt="Hóa đơn" style="width:100%;border:1px solid #dfe3ec;border-radius:8px;background:#fff;min-height:120px">
  <div class="actions"><button class="secondary" onclick="closeModal()">Đóng</button>${canShare?'<button class="secondary" onclick="invShare()">📤 Chia sẻ</button>':''}<button onclick="invDownload()">⬇ Tải ảnh</button></div></div>`);
  invRefresh();
}
function invFileName(){
  const o=invState.o,c=customer(o.customerId);
  const slug=String(c?.name||'khach').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/gi,'d').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'');
  return `hoa-don-${slug}-${o.date}.png`;
}
function invDownload(){
  if(!invState||!invState.canvas)return;
  const name=invFileName();
  invState.canvas.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)},'image/png');
}
function invShare(){
  if(!invState||!invState.canvas)return;
  const name=invFileName();
  invState.canvas.toBlob(async b=>{const f=new File([b],name,{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'Hóa đơn'})}catch(e){}}else invDownload()},'image/png');
}

function cycHidden(){try{return JSON.parse(localStorage.getItem(CYC_HIDE_KEY)||'{}')}catch(e){return{}}}
function cycSaveHidden(h){try{localStorage.setItem(CYC_HIDE_KEY,JSON.stringify(h))}catch(e){alert('Không lưu được trên máy này')}}
function cycIsHidden(x,h){h=h||cycHidden();return !!h[x.c.id]&&x.last<=h[x.c.id]}
function cycHide(id){
  const c=customer(id),x=c&&cycleInfo(c);if(!x)return;
  if(!confirm('Bỏ '+c.name+' khỏi theo dõi chu kỳ nhập?\nKhách vẫn còn trong danh sách khách hàng và đơn hàng. Nếu khách đặt đơn mới, app sẽ tự theo dõi lại.'))return;
  const h=cycHidden();h[id]=x.last;cycSaveHidden(h);render();
}
function cycShow(id){const h=cycHidden();delete h[id];cycSaveHidden(h);render()}
function cyclePage(){
  const filt=window.cycleFilter||'need';
  const hid=cycHidden();
  const every=db.customers.map(cycleInfo).filter(Boolean);
  const hiddenList=every.filter(x=>cycIsHidden(x,hid)).sort((a,b)=>b.last.localeCompare(a.last));
  const all=every.filter(x=>!cycIsHidden(x,hid));
  all.forEach(x=>x.st=cycleStatus(x));
  const cnt=k=>k==='hidden'?hiddenList.length:all.filter(x=>k==='need'?(x.st==='late'||x.st==='soon'):k==='all'?true:x.st===k).length;
  const rows=filt==='hidden'?hiddenList:all.filter(x=>filt==='need'?(x.st==='late'||x.st==='soon'):filt==='all'?true:x.st===filt)
    .sort((a,b)=>(a.left??9999)-(b.left??9999));
  const fb=(k,t)=>`<button class="${filt===k?'':'secondary'} small" onclick="setCycleFilter('${k}')">${t} (${cnt(k)})</button>`;
  const when=n=>n<0?`trễ ${-n} ngày`:n===0?'hết hôm nay':`còn ${n} ngày`;
  const q=n=>Number(n.toFixed(1)).toLocaleString('vi-VN');
  const tagOf=x=>filt==='hidden'?`<span class="tag">Đã bỏ theo dõi</span>`:x.st==='late'?`<span class="tag bad">Trễ ${-x.left} ngày, gọi ngay</span>`
    :x.st==='soon'?`<span class="tag warn">${x.left===0?'Hôm nay đến hạn':'Còn '+x.left+' ngày là hết'}</span>`
    :x.st==='ok'?`<span class="tag">Còn ${x.left} ngày</span>`
    :`<span class="tag warn">Mới 1 lần nhập</span>`;
  const itemTxt=x=>{
    const top=[...x.items].sort((a,b)=>b[1]-a[1]).slice(0,3).map(([n,v])=>`${esc(n)} ×${Number(v.toFixed(2))}`).join(', ');
    return top+(x.items.length>3?` +${x.items.length-3} món`:'');
  };
  const prodTxt=x=>x.shown.slice(0,3).map(p=>`${esc(p.name)} (${when(p.left)}, thường lấy ~${q(p.qty)})`).join('; ');
  return `<div class="toolbar">${fb('need','🔔 Cần chuẩn bị')}${fb('late','Trễ hạn')}${fb('ok','Còn hàng')}${fb('new','Chưa đủ dữ liệu')}${fb('all','Tất cả')}${hiddenList.length||filt==='hidden'?fb('hidden','🚫 Đã bỏ theo dõi'):''}</div>
  <div id="cycleRows" class="olist">${rows.length?rows.map(x=>{
    const tel=String(x.c.phone||'').replace(/[^0-9+]/g,'');
    const hide=filt==='hidden';
    return `<div class="orow"><div class="oic">${hide?'🚫':x.st==='late'?'🔴':x.st==='soon'?'🟠':x.st==='ok'?'🟢':'⚪'}</div><div class="omid"><div class="lname">${esc(x.c.name)}</div>
    <div class="lline">🛒 Lần nhập gần nhất ${dateFmt(x.last)} (${x.since} ngày trước): ${itemTxt(x)||'—'}</div>
    ${!hide&&x.byQty?`<div class="lline">📦 ${prodTxt(x)}</div>`:''}
    ${hide?'':`<div class="lline">${x.left===null?'Cần thêm 1 lần nhập nữa để dự báo':`🔄 Dự kiến hết hàng ${x.next.toLocaleDateString('vi-VN')}${x.cycle!==null?` · chu kỳ ~${x.cycle} ngày`:''}`}</div>`}
    <div class="lmeta">${tagOf(x)} ${tel?`<a class="tag" href="tel:${tel}" onclick="event.stopPropagation()">📞 Gọi ${esc(x.c.phone)}</a>`:''}
    ${hide?`<button class="secondary small" onclick="cycShow('${esc(x.c.id)}')">↩ Theo dõi lại</button>`:`<button class="secondary small" onclick="cycHide('${esc(x.c.id)}')">🚫 Bỏ theo dõi</button>`}</div></div></div>`}).join(''):'<div class="notice">Chưa có khách nào ở nhóm này.</div>'}</div>
  <div class="notice" style="margin-top:12px">Dự báo theo từng sản phẩm: lượng khách đã lấy chia cho số ngày đến lần lấy kế tiếp ra mức dùng mỗi ngày (lấy tối đa 5 lần gần nhất). Lượng của lần nhập gần nhất chia mức dùng ra số ngày hàng đủ dùng. Khách lấy nhiều hơn thường lệ sẽ được báo hết muộn hơn, lấy ít hơn thì báo sớm hơn. Món khách đã lâu không lấy (trễ quá gấp đôi số ngày đủ dùng, tối thiểu 7 ngày) được bỏ qua để không báo oan khi khách vẫn đặt các món khác. Sản phẩm mới mua 1 lần chưa dự báo được, khi đó app tính tạm theo chu kỳ ngày. Khách bạn bấm "Bỏ theo dõi" sẽ biến mất khỏi danh sách và trang chủ (chỉ trên máy này), và tự quay lại nếu khách có đơn mới.</div>`;
}
function bonusMonths(){
  const set=new Set(db.orders.filter(o=>o.date).map(o=>o.date.slice(0,7)));set.add(today().slice(0,7));
  return [...set].sort().reverse();
}
function setBonusMonth(v){window.bonusMonth=v;render()}
function shiftBonusMonth(d){
  const ms=bonusMonths(),cur=window.bonusMonth||today().slice(0,7);
  if(cur==='all')return;
  const i=ms.indexOf(cur)+d;if(i>=0&&i<ms.length)setBonusMonth(ms[i]);
}
function bonusPage(){
  const ms=bonusMonths(),cur=window.bonusMonth||today().slice(0,7);
  const label=m=>m==='all'?'Tất cả các tháng':`Tháng ${m.slice(5)}/${m.slice(0,4)}`;
  const list=db.orders.filter(o=>o.date&&(cur==='all'||o.date.slice(0,7)===cur));
  const by={};
  list.forEach(o=>{const id=o.customerId||'';const e=by[id]||(by[id]={id,orders:0,revenue:0,profit:0});e.orders++;e.revenue+=revenue(o);e.profit+=orderProfit(o)});
  const rows=Object.values(by).map(e=>{const c=customer(e.id);e.name=c?c.name:'Khách lẻ';return e}).sort((a,b)=>b.profit-a.profit);
  const tp=rows.reduce((s,e)=>s+e.profit,0),tr=rows.reduce((s,e)=>s+e.revenue,0),to=rows.reduce((s,e)=>s+e.orders,0);
  const medal=['🥇','🥈','🥉'];
  return `<div class="toolbar" style="align-items:center">
    <button class="secondary small" onclick="shiftBonusMonth(1)">‹</button>
    <select onchange="setBonusMonth(this.value)" style="flex:1">${ms.map(m=>`<option value="${m}" ${m===cur?'selected':''}>${label(m)}</option>`).join('')}<option value="all" ${cur==='all'?'selected':''}>Tất cả các tháng</option></select>
    <button class="secondary small" onclick="shiftBonusMonth(-1)">›</button></div>
  <div class="notice" style="margin:10px 0"><strong>${label(cur)}</strong>: lãi <strong class="${tp<0?'negative':'positive'}" style="margin-left:0">${money(tp)}</strong> · doanh thu ${money(tr)} · ${to} đơn · ${rows.length} khách</div>
  <div id="bonusRows" class="olist">${rows.length?rows.map((e,i)=>`<div class="orow"><div class="oic">${i<3&&e.profit>0?medal[i]:i+1}</div><div class="omid"><div class="lname">${esc(e.name)}</div><div class="lline">${e.orders} đơn · doanh thu ${money(e.revenue)}${e.revenue>0?` · lãi ${Math.round(e.profit/e.revenue*1000)/10}%`:''}</div></div><div class="oright"><div class="oamt"><span class="${e.profit<0?'negative':'positive'}" style="margin-left:0">${money(e.profit)}</span></div></div></div>`).join(''):'<div class="notice">Chưa có đơn hàng nào trong khoảng này.</div>'}</div>`;
}

function reportsPage(){
  let mode=window.reportMode||'day',anchor=window.reportDate||today(),{from,to}=reportRange(mode,anchor);
  let oo=db.orders.filter(o=>inRange(o.date,from,to)),ee=db.expenses.filter(e=>inRange(e.date,from,to)),tt=totals(oo,ee),bb=expenseBreakdown(oo,ee),allCost=tt.c+bb.ads+bb.other;
  let label=mode==='day'?dateFmt(anchor):mode==='week'?'Tuần '+dateFmt(from)+' – '+dateFmt(to):'Tháng '+anchor.slice(5,7)+'/'+anchor.slice(0,4);
  let hint=mode==='day'?'Chọn ngày':mode==='week'?'Chọn ngày bất kỳ trong tuần':'Chọn tháng';
  let pick=mode==='month'?`<input type="month" value="${anchor.slice(0,7)}" onchange="reportSet(this.value&&this.value+'-01')">`:`<input type="date" value="${anchor}" onchange="reportSet(this.value)">`;
  let wd=['CN','T2','T3','T4','T5','T6','T7'],days=[];
  if(mode!=='day'){for(let d=new Date(from+'T00:00:00');d.toLocaleDateString('sv-SE')<=to;d.setDate(d.getDate()+1)){let k=d.toLocaleDateString('sv-SE'),o1=oo.filter(o=>o.date===k),e1=ee.filter(e=>e.date===k),t1=totals(o1,e1),b1=expenseBreakdown(o1,e1);days.push({key:k,wd:wd[d.getDay()],label:mode==='week'?wd[d.getDay()]+' '+k.slice(8):k.slice(8),...t1,ads:b1.ads,other:b1.other,allCost:t1.c+b1.ads+b1.other,has:o1.length+e1.length})}}
  let series=mode==='week'?[{key:'r',label:'Doanh thu',color:'#3478ee',type:'bar'},{key:'allCost',label:'Tổng chi phí',color:'#f29b38',type:'bar'},{key:'p',label:'Lợi nhuận',color:'#18a875',type:'line'}]:[{key:'r',label:'Doanh thu',color:'#3478ee',type:'bar'},{key:'p',label:'Lợi nhuận',color:'#18a875',type:'bar'}];
  let dayRows=days.filter(d=>d.has).reverse().map(d=>`<div class="orow" onclick="reportDrill('${d.key}')"><div class="oic" style="font-weight:800;font-size:16px">${d.key.slice(8)}</div><div class="omid"><div class="lname">${d.wd} · ${dateFmt(d.key)}</div><div class="lline">${d.n} đơn · Vốn ${money(d.c)}</div><div class="lmeta">QC ${money(d.ads)} · Khác ${money(d.other)}</div></div><div class="oright"><div class="oamt">${money(d.r)}</div><div class="odate ${d.p<0?'negative':'positive'}">Lãi ${money(d.p)}</div></div></div>`).join('');
  let detail=mode==='day'
   ?`<section class="panel" style="margin-bottom:16px"><h2>Đơn hàng trong ngày</h2><div class="olist" style="box-shadow:none;border:0;padding:0">${[...oo].reverse().map(orderRow).join('')||'<div class="empty">Không có đơn hàng</div>'}</div></section><section class="panel"><h2>Chi phí trong ngày</h2><div class="olist" style="box-shadow:none;border:0;padding:0">${ee.map(e=>`<div class="orow"><div class="oic">${(e.type||(e.category==='Quảng cáo'?'ads':'other'))==='ads'?'📣':'🧾'}</div><div class="omid"><div class="lname">${esc(e.name)}</div><div class="lmeta">${e.orderId?'Gắn với đơn '+esc(e.orderId):'Chi phí chung'}</div></div><div class="oright"><div class="oamt">${money(e.amount)}</div></div></div>`).join('')||'<div class="empty">Không có chi phí ghi riêng</div>'}</div></section>`
   :`<section class="panel" style="margin-bottom:16px"><h2>Doanh thu, lợi nhuận & chi phí theo ngày</h2>${analyticsChart(days,series)}</section><section class="panel"><h2>Chi tiết từng ngày</h2><div class="olist" style="box-shadow:none;border:0;padding:0">${dayRows||'<div class="empty">Chưa có dữ liệu trong khoảng này</div>'}</div></section>`;
  return `<div class="toolbar"><button class="${mode==='day'?'':'secondary'}" onclick="reportSetMode('day')">Ngày</button><button class="${mode==='week'?'':'secondary'}" onclick="reportSetMode('week')">Tuần</button><button class="${mode==='month'?'':'secondary'}" onclick="reportSetMode('month')">Tháng</button></div>
  <div class="rp-nav"><button class="secondary" onclick="reportShift(-1)">‹</button><div class="rp-mid"><strong>${label}</strong>${pick}<small class="muted">${hint}</small></div><button class="secondary" onclick="reportShift(1)">›</button></div>
  <div class="toolbar"><button class="secondary small" onclick="reportToday()">${mode==='day'?'Hôm nay':mode==='week'?'Tuần này':'Tháng này'}</button></div>
  <div class="cards report-metrics">${metric('Doanh thu',money(tt.r),label)}${metric('Tổng chi phí',money(allCost),'Giá vốn + quảng cáo + chi phí khác')}${metric('Chi phí quảng cáo',money(bb.ads))}${metric('Chi phí khác',money(bb.other))}</div><div class="report-profit-strip"><span><strong>Lợi nhuận ròng</strong><small>${tt.n} đơn hàng</small></span><strong class="${tt.p<0?'negative':'positive'}">${money(tt.p)}</strong></div>
  ${detail}`;

function openModal(title,html,after){
  document.getElementById('modalTitle').textContent=title;
  document.getElementById('modalBody').innerHTML=html;
  document.getElementById('modal').classList.remove('hidden');
  if(after)after();
}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
document.getElementById('closeModal').onclick=closeModal;
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

/* ================= HIỆU ỨNG MỜ QUAY VÒNG KHI LƯU ================= */
function showLoading(text){
  let ov = G('loadingOverlay'), tx = G('loadingText');
  if(tx) tx.textContent = text || 'Đang lưu & đồng bộ...';
  if(ov) ov.classList.remove('hidden');
}
function hideLoading(){
  let ov = G('loadingOverlay');
  if(ov) ov.classList.add('hidden');
}

// 1. KHÁCH HÀNG
function openCustomer(){
  openModal('Thêm khách hàng',`<div class="formgrid"><div class="field"><label>Tên khách hàng *</label><input id="cName" required></div><div class="field"><label>Số điện thoại</label><input id="cPhone"></div><div class="field"><label>Khu vực / tỉnh thành</label><input id="cArea" placeholder="Ví dụ: Từ Sơn, Bắc Ninh"></div><div class="field"><label>Địa chỉ chi tiết</label><input id="cAddress"></div><div class="field span2"><label>Ghi chú</label><textarea id="cNote" rows="2"></textarea></div></div><div class="actions"><button class="secondary" onclick="closeModal()">Hủy</button><button onclick="saveCustomer()">Lưu khách hàng</button></div>`);
}

async function saveCustomer(id=null){
  let name=document.getElementById('cName').value.trim();
  if(!name)return alert('Vui lòng nhập tên khách hàng');
  let data={name,phone:cPhone.value.trim(),area:cArea.value.trim(),address:cAddress.value.trim(),note:cNote.value.trim(),_u:Date.now()};
  let item;
  if(id){
    let c=customer(id);if(!c)return alert('Không tìm thấy khách hàng');
    Object.assign(c,data);
    item=c;
  }else{
    item={id:uid('KH'),...data};
    db.customers.push(item);
  }
  closeModal();
  showLoading('Đang lưu & đồng bộ khách hàng...');
  try {
    persist();
    await pushSingleItem('customers', item);
    render();
    toast('✅ Đã lưu khách hàng!');
  } finally {
    hideLoading();
  }
}

function editCustomer(id){
  let c=customer(id);if(!c)return;
  openModal('Chỉnh sửa khách hàng',`<div class="formgrid"><div class="field"><label>Tên khách hàng *</label><input id="cName" required value="${esc(c.name)}"></div><div class="field"><label>Số điện thoại</label><input id="cPhone" value="${esc(c.phone||'')}"></div><div class="field"><label>Khu vực / tỉnh thành</label><input id="cArea" value="${esc(c.area||'')}"></div><div class="field"><label>Địa chỉ chi tiết</label><input id="cAddress" value="${esc(c.address||'')}"></div><div class="field span2"><label>Ghi chú</label><textarea id="cNote" rows="2">${esc(c.note||'')}</textarea></div></div><div class="actions"><button class="secondary" onclick="closeModal()">Hủy</button><button onclick="saveCustomer('${id}')">Lưu thay đổi</button></div>`);
}

function compressProductImage(file){
  return new Promise((resolve,reject)=>{
    let r=new FileReader();
    r.onload=()=>{
      let im=new Image();
      im.onload=()=>{
        // Thu nhỏ kích thước tối đa 220px và chất lượng 0.45 để siêu nhẹ khi đồng bộ
        let scale=Math.min(1,220/Math.max(im.width,im.height)),c=document.createElement('canvas');
        c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        resolve(c.toDataURL('image/jpeg',0.45));
      };
      im.onerror=reject;im.src=r.result;
    };
    r.onerror=reject;r.readAsDataURL(file);
  });
}

async function del(type,id){
  if(!confirm('Bạn chắc chắn muốn xóa mục này?'))return;
  showLoading('Đang xóa & đồng bộ...');
  try {
    if(type==='orders'){
      let linkedIds = db.expenses.filter(e=>e.orderId===id).map(e=>e.id);
      db.expenses=db.expenses.filter(e=>e.orderId!==id);
      for(let eid of linkedIds) await deleteRemoteItem('expenses', eid);
    }
    db[type]=db[type].filter(x=>x.id!==id);
    persist();
    await deleteRemoteItem(type, id);
    render();
    toast('🗑 Đã xóa thành công!');
  } finally {
    hideLoading();
  }
}

async function restore(ev){
  let f=ev.target.files[0];if(!f)return;
  let r=new FileReader();
  r.onload=async()=>{
    try{
      let d=JSON.parse(r.result);
      if(!d.orders||!d.customers||!d.products||!d.expenses)throw Error();
      if(confirm('Khôi phục sẽ nạp toàn bộ dữ liệu từ file lên 4 bảng đám mây. Tiếp tục?')){
        db=d; persist(); render();

          await pushAllFromBackup();

        }
        alert('Đã khôi phục và đồng bộ xong!');
      }
    }catch{alert('File sao lưu không hợp lệ')}
  };
  r.readAsText(f);
}

  return true;
}

/* --- HÀM ĐẨY 1 MỤC DUY NHẤT LÊN BẢNG TƯƠNG ỨNG --- */
async function pushSingleItem(table, item) {
  if(!cloudUser || !ensureCloud() || !navigator.onLine) return false;
  setSync('busy');
  try {
    let payload = { ...item, user_id: cloudUser.id, updated_at: new Date().toISOString() };
    if(table === 'orders') {
      payload.customer_id = item.customerId || '';
      payload.ship_fee = num(item.shipFee);
      payload.extra_cost = num(item.extraCost);
      delete payload.customerId; delete payload.shipFee; delete payload.extraCost;
    }
    if(table === 'expenses') {
      payload.order_id = item.orderId || '';
      delete payload.orderId;
    }
    let { error } = await cloud.from(table).upsert(payload);
    if(error) throw error;
    markOk();
    return true;
  } catch(e) {
    setSync('err', e.message);
    return false;
  }
}

async function deleteRemoteItem(table, id) {
  if(!cloudUser || !ensureCloud() || !navigator.onLine) return;
  try {
    await cloud.from(table).delete().eq('id', id).eq('user_id', cloudUser.id);
    markOk();
  } catch(e) { setSync('err', e.message); }
}

/* --- KHI MỞ WEB: CHỈ TẢI DỮ LIỆU MỚI & KHÔNG TẢI LẠI ẢNH NẶNG ĐÃ CÓ --- */
async function pullLightweightStartup() {
  if(!cloudUser || !ensureCloud() || !navigator.onLine) return;
  setSync('busy');
  try {
    // 1. Tải song song Orders, Customers, Expenses (toàn bộ là text nên cực nhẹ, chỉ vài KB)
    const [resO, resC, resE] = await Promise.all([
      cloud.from('orders').select('*').eq('user_id', cloudUser.id),
      cloud.from('customers').select('*').eq('user_id', cloudUser.id),
      cloud.from('expenses').select('*').eq('user_id', cloudUser.id)
    ]);

    if(resO.data) {
      db.orders = resO.data.map(r => ({
        id: r.id, date: r.date, customerId: r.customer_id, lines: r.lines || [],
        surcharge: r.surcharge, shipFee: r.ship_fee, extraCost: r.extra_cost, note: r.note, _u: r._u
      }));
    }
    if(resC.data) db.customers = resC.data;
    if(resE.data) {
      db.expenses = resE.data.map(r => ({
        id: r.id, date: r.date, name: r.name, category: r.category, type: r.type,
        amount: r.amount, orderId: r.order_id, note: r.note, _u: r._u
      }));
    }

    // 2. Với Sản phẩm: Chỉ lấy thông tin chữ (id, name, cost, price, note, _u) KHÔNG lấy cột image nặng trước
    const resP = await cloud.from('products').select('id, name, cost, price, note, _u').eq('user_id', cloudUser.id);
    if(resP.data) {
      let oldMap = new Map(db.products.map(p => [p.id, p]));
      let missingImgIds = [];
      db.products = resP.data.map(r => {
        let localP = oldMap.get(r.id);
        // Nếu máy đã có sẵn ảnh của SP này và bản ghi không đổi thì giữ nguyên ảnh trên máy, không tải lại!
        if(localP && localP.image && localP._u === r._u) {
          return { ...r, image: localP.image };
        } else {
          missingImgIds.push(r.id);
          return { ...r, image: localP?.image || '' };
        }
      });

      // Chỉ tải ảnh cho những sản phẩm mới thêm hoặc bị thay đổi ảnh
      if(missingImgIds.length > 0) {
        const resImgs = await cloud.from('products').select('id, image').in('id', missingImgIds);
        if(resImgs.data) {
          resImgs.data.forEach(imgRow => {
            let target = db.products.find(x => x.id === imgRow.id);
            if(target && imgRow.image) target.image = imgRow.image;
          });
        }
      }
    }

    persist();
    render();
    markOk();
  } catch(e) {
    setSync('err', e.message);
  }
}

/* Đẩy toàn bộ dữ liệu từ file JSON backup lên 4 bảng mới */
async function pushAllFromBackup() {
  if(!cloudUser) return;
  for(let c of db.customers) await pushSingleItem('customers', c);
  for(let p of db.products) await pushSingleItem('products', p);
  for(let o of db.orders) await pushSingleItem('orders', o);
  for(let e of db.expenses) await pushSingleItem('expenses', e);
}

/* --- LƯU ĐƠN HÀNG MỚI (CÓ MỜ QUAY VÒNG & ĐỒNG BỘ RIÊNG BẢNG ORDERS) --- */
async function saveOrder(){
  if(savingOrder)return;
  let lines=orderLines.filter(l=>l.name.trim()&&qtyVal(l.qty)>0);
  if(!lines.length)return alert('Thêm ít nhất một sản phẩm có tên và số lượng lớn hơn 0');
  
  let o={
    id:newId('DH'),
    date:G('oDate').value||today(),
    customerId:G('oCustomer').value,
    lines:lines.map(l=>({...l,qty:qtyVal(l.qty)})),
    surcharge:num(G('oSur').value),
    shipFee:num(G('oShip').value),
    extraCost:num(G('oShip').value),
    note:G('oNote').value.trim(),
    _u:Date.now()
  };

  savingOrder = true;
  let btn = document.querySelector('#orderPage .fp-save');
  if(btn) btn.disabled = true;
  showLoading('Đang lưu & đồng bộ đơn hàng...');

  try{
    db.orders.push(o);
    persist();
    if(cloudConfigured() && navigator.onLine){
      if(cloudUser || await restoreSession()) {
        await pushSingleItem('orders', o);
      }
    }
    closeOrderPage(false);
    render();
    toast('✅ Đã tạo và đồng bộ đơn hàng!');
  }finally{
    savingOrder = false;
    if(btn) btn.disabled = false;
    hideLoading();
  }
}

/* --- KHỞI ĐỘNG --- */
function loadScript(u){return new Promise(res=>{let t=document.createElement('script');t.src=u;t.onload=()=>res(true);t.onerror=()=>res(false);document.head.appendChild(t)})}
async function boot(){
  if(!window.supabase){
    for(const u of SB_SRC){if(await loadScript(u))break}
  }
  if(cloudConfigured() && ensureCloud()){
    if(await restoreSession()){
      await pullLightweightStartup();
    } else setSync('out');
  } else setSync('none');
}

  <div id="ocNew" class="hidden"><div class="kv"><span>Tên *</span><input id="nName"></div><div class="kv"><span>SĐT</span><input id="nPhone" inputmode="tel"></div><div class="kv"><span>Khu vực</span><input id="nArea" placeholder="Từ Sơn, Bắc Ninh"></div><div class="kv"><span>Địa chỉ</span><input id="nAddress"></div><button type="button" class="full-btn" onclick="ocSaveNew()">Lưu khách hàng</button></div></div>
 <div class="sec"><div class="kv"><span>Ngày bán</span><input id="oDate" type="date" value="${today()}"></div><div class="kv"><span>Ghi chú</span><input id="oNote" placeholder="Giao sáng trước 9h..."></div></div>
 <div class="sec"><div class="kv"><span>Phụ phí (thu thêm)</span><input id="oSur" inputmode="numeric" value="0" oninput="updateOrderSummary()"></div><div class="kv"><span>Phí vận chuyển (trừ đi)</span><input id="oShip" inputmode="numeric" value="0" oninput="updateOrderSummary()"></div><div id="orderSummary"></div></div>
</div>
<div class="fp-foot"><span>Tổng tiền</span><strong id="ofTotal">0 ₫</strong></div>`;
  G('orderPage').classList.remove('hidden');document.body.style.overflow='hidden';renderOrderLines();ocShow();
}

function closeOrderPage(ask){if(ask&&orderLines.length&&!confirm('Bỏ đơn đang tạo?'))return;G('orderPage').classList.add('hidden');G('orderPage').innerHTML='';document.body.style.overflow=''}
function ocShow(){let c=customer(G('oCustomer').value);G('ocPhone').textContent=c?.phone||'Không có';G('ocAddr').textContent=[c?.area,c?.address].filter(Boolean).join(' · ')||'Không có'}
function ocToggleNew(){G('ocNew').classList.toggle('hidden')}

async function ocSaveNew(){
  let name=G('nName').value.trim();if(!name)return alert('Vui lòng nhập tên khách hàng');
  let c={id:uid('KH'),name,phone:G('nPhone').value.trim(),area:G('nArea').value.trim(),address:G('nAddress').value.trim(),note:'',_u:Date.now()};
  showLoading('Đang lưu khách hàng mới...');
  try {
    db.customers.push(c);
    persist();
    await pushSingleItem('customers', c);
    G('oCustomer').innerHTML=custOpts(c.id);
    G('ocNew').classList.add('hidden');
    ['nName','nPhone','nArea','nAddress'].forEach(k=>G(k).value='');
    ocShow();
    toast('✅ Đã thêm khách hàng!');
  } finally {
    hideLoading();
  }
}

const lineTotal=l=>money(num(l.price)*qtyVal(l.qty));
function olHtml(l,i){let p=product(l.productId),img=p&&p.image?`<img src="${p.image}" alt="">`:'<div class="ph">📦</div>';
  return `<div class="ol"><div>${img}</div><div><div class="ol-name">${i+1}. ${l.productId?esc(l.name):`<input class="ol-nm" placeholder="Tên sản phẩm ngoài..." value="${esc(l.name)}" oninput="orderLines[${i}].name=this.value">`}</div>
<div class="stepper"><button type="button" onclick="olQty(${i},-1)">−</button><input inputmode="decimal" value="${l.qty}" oninput="olSet(${i},this.value)" onchange="olFix(${i},this)"><button type="button" onclick="olQty(${i},1)">+</button></div> <span class="muted">kg</span>
${l.productId?'':`<input class="ol-cost" inputmode="numeric" placeholder="Giá vốn / 1kg" value="${fmtMoneyInput(l.cost)}" oninput="orderLines[${i}].cost=num(this.value);updateOrderSummary()">`}</div>
<div class="ol-price"><button type="button" class="small danger" onclick="olDel(${i})">×</button><div class="ol-total" id="olt${i}">${lineTotal(l)}</div><input class="ol-unit" inputmode="numeric" placeholder="đ / 1kg" value="${fmtMoneyInput(l.price)}" oninput="olPrice(${i},this.value)"></div></div>`}

function renderOrderLines(){let b=G('orderLines');if(!b)return;b.innerHTML=orderLines.map(olHtml).join('')||'<div class="empty">Chưa có hàng hóa. Bấm “＋ Thêm” để chọn.</div>';updateOrderSummary()}
function olRefresh(i){let t=G('olt'+i);if(t)t.textContent=lineTotal(orderLines[i]);updateOrderSummary()}
function olSet(i,v){orderLines[i].qty=Math.max(0,qtyVal(v));olRefresh(i)}
function olFix(i,el){let q=qtyVal(orderLines[i].qty);if(!(q>0))q=1;orderLines[i].qty=q;el.value=q;olRefresh(i)}
function olQty(i,d){let n=Math.round((qtyVal(orderLines[i].qty)+d)*100)/100;if(n<=0)n=0.5;orderLines[i].qty=n;renderOrderLines()}
function olPrice(i,v){orderLines[i].price=num(v);olRefresh(i)}
function olDel(i){orderLines.splice(i,1);renderOrderLines()}

function updateOrderSummary(){
  let goods=orderLines.reduce((s,l)=>s+qtyVal(l.qty)*num(l.price),0),c=orderLines.reduce((s,l)=>s+qtyVal(l.qty)*num(l.cost),0),q=orderLines.reduce((s,l)=>s+qtyVal(l.qty),0),sur=num(G('oSur')?.value),ship=num(G('oShip')?.value),total=goods+sur,p=total-c-ship;
  let x=G('orderSummary');if(x)x.innerHTML=`<div class="summaryline"><span>Số lượng</span><strong>${q.toLocaleString('vi-VN')} kg</strong></div><div class="summaryline"><span>Tiền hàng</span><strong>${money(goods)}</strong></div><div class="summaryline"><span>Phụ phí</span><strong>+ ${money(sur)}</strong></div><div class="summaryline"><span>Tổng khách trả</span><strong>${money(total)}</strong></div><div class="summaryline"><span>Giá vốn</span><strong>${money(c)}</strong></div><div class="summaryline"><span>Phí vận chuyển</span><strong>− ${money(ship)}</strong></div><div class="summaryline"><strong>Lợi nhuận dự kiến</strong><strong class="${p<0?'negative':'positive'}">${money(p)}</strong></div>`;
  let t=G('ofTotal');if(t)t.textContent=money(total);
}

function openPicker(){pickSel=new Set(orderLines.filter(l=>l.productId).map(l=>l.productId));G('pickQ').value='';G('pickPage').classList.remove('hidden');renderPick()}
function closePicker(){G('pickPage').classList.add('hidden')}
function renderPick(){let q=G('pickQ').value.trim().toLowerCase(),ps=db.products.filter(p=>p.name.toLowerCase().includes(q));
  G('pickList').innerHTML=ps.map(p=>`<div class="pk ${pickSel.has(p.id)?'on':''}" onclick="pickToggle('${p.id}')"><div class="th">${p.image?`<img src="${p.image}" alt="">`:'📦'}<div class="tick">✓</div></div><div class="nm">${esc(p.name)}</div><div class="pr">${money(p.price)}</div></div>`).join('')||'<div class="empty">Chưa có sản phẩm.</div>';
  G('pickCount').textContent=pickSel.size}
function pickToggle(id){pickSel.has(id)?pickSel.delete(id):pickSel.add(id);renderPick()}
function pickApply(){orderLines=orderLines.filter(l=>!l.productId||pickSel.has(l.productId));pickSel.forEach(id=>{if(!orderLines.some(l=>l.productId===id)){let p=product(id);if(p)orderLines.push({productId:id,name:p.name,qty:1,price:num(p.price),cost:num(p.cost)})}})}
function pickDone(){pickApply();closePicker();renderOrderLines()}
function pickCustom(){pickApply();orderLines.push({productId:'',name:'',qty:1,price:0,cost:0});closePicker();renderOrderLines()}

function zoomPanel(){let z=Number(localStorage.getItem('mysales_zoom'))||1;return `<section class="panel" style="margin-bottom:15px"><h2>Cỡ hiển thị trên máy này</h2><div class="toolbar">${[0.8,0.85,0.9,1].map(v=>`<button class="${Math.abs(z-v)<.01?'':'secondary'}" onclick="setZoom(${v})">${Math.round(v*100)}%</button>`).join('')}</div></section>`}
function setZoom(z){localStorage.setItem('mysales_zoom',z);document.body.style.zoom=z;render()}
(function(){let z=Number(localStorage.getItem('mysales_zoom'));if(z>=.7&&z<=1.3)document.body.style.zoom=z})();

function reportRange(mode,a){let d=new Date(a+'T00:00:00');if(mode==='day')return{from:a,to:a};if(mode==='week'){let f=weekStart(a);return{from:f,to:new Date(new Date(f+'T00:00:00').getTime()+6*86400000).toLocaleDateString('sv-SE')}}return{from:new Date(d.getFullYear(),d.getMonth(),1).toLocaleDateString('sv-SE'),to:new Date(d.getFullYear(),d.getMonth()+1,0).toLocaleDateString('sv-SE')}}
function reportShift(n){let m=window.reportMode||'day',d=new Date((window.reportDate||today())+'T00:00:00');if(m==='day')d.setDate(d.getDate()+n);else if(m==='week')d.setDate(d.getDate()+7*n);else{d.setDate(1);d.setMonth(d.getMonth()+n)}window.reportDate=d.toLocaleDateString('sv-SE');render()}
function reportSetMode(m){window.reportMode=m;render()}
function reportSet(v){if(v){window.reportDate=v;render()}}
function reportToday(){window.reportDate=today();render()}
function reportDrill(d){window.reportMode='day';window.reportDate=d;render()}
['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
